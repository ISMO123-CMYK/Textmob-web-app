  <script>
    window.VITE_API_URL = "https://textmob-provider-api-99ii.onrender.com";
    const user = localStorage.getItem("currentUser");
    const isAuthPage = window.location.pathname.startsWith('/auth') || window.location.hash.startsWith('#/auth');
    if ((!user || user === "undefined") && !isAuthPage) {
      window.location.href = '/auth';
    } else if (user && user !== "undefined" && !isAuthPage) {
      // Background verification
      (function() {
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
          ? 'http://localhost:5000' 
          : 'https://textmob-provider-api-99ii.onrender.com';
        fetch(API_URL + '/api/verify-user?username=' + encodeURIComponent(user))
          .then(res => res.json())
          .then(data => {
            if (data.exists === false) {
              localStorage.clear();
              window.location.href = '/auth';
            }
          })
          .catch(err => {}); // Fail silently
      })();
    }

    // TextMob iframe script
    (function () {
      const PARENT_ORIGIN = window.location.origin;
      function getCurrentUser() {
        return localStorage.getItem("currentUser") || "";
      }
      function postCurrentUserToParent() {
        const payload = { type: "currentUser", value: getCurrentUser() };
        try { window.parent.postMessage(JSON.stringify(payload), PARENT_ORIGIN); }
        catch (err) { console.error("postMessage to parent failed:", err); }
      }
      window.addEventListener("DOMContentLoaded", postCurrentUserToParent);
      window.addEventListener("message", (ev) => {
        let data;
        try { data = typeof ev.data === "string" ? JSON.parse(ev.data) : ev.data; }
        catch (err) { return; }
        if (!data || !data.type) return;
        if (data.type === "requestCurrentUser") { postCurrentUserToParent(); }
      });
    })();

    // DarkReader preferences
    (function () {
      function safeCallDarkReader(fn) {
        if (window.DarkReader) { try { fn(); } catch (e) { console.error("DarkReader error", e); } return; }
        let tries = 0;
        const t = setInterval(() => {
          tries += 1;
          if (window.DarkReader) { clearInterval(t); try { fn(); } catch (e) { console.error("DarkReader error", e); } }
          else if (tries > 30) { clearInterval(t); }
        }, 100);
      }
      function applyDarkMode(mode) {
        if (mode === "light") {
          if (window.DarkReader) { try { window.DarkReader.disable(); } catch (e) { } }
          return;
        }
        safeCallDarkReader(() => {
          try { if (window.DarkReader && typeof window.DarkReader.setFetchMethod === "function") { window.DarkReader.setFetchMethod(window.fetch); } } catch (e) { }
          if (mode === "dark") { window.DarkReader.enable({ brightness: 100, contrast: 100, sepia: 0 }); }
          else if (mode === "custom") { window.DarkReader.enable({ brightness: 110, contrast: 90, sepia: 8 }); }
          else {
            if (typeof window.DarkReader.auto === "function") { window.DarkReader.auto({ brightness: 100, contrast: 100, sepia: 0 }); }
            else { const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; prefersDark ? window.DarkReader.enable() : window.DarkReader.disable(); }
          }
        });
      }
      const savedMode = localStorage.getItem("darkMode") || "system";
      applyDarkMode(savedMode);
      window.addEventListener("app:preferences:update", (e) => {
        try { const detail = e.detail || {}; if (typeof detail.darkMode === "string") { localStorage.setItem("darkMode", detail.darkMode); applyDarkMode(detail.darkMode); } } catch (err) { }
      });
      window.addEventListener("storage", (e) => { if (e.key === "darkMode" && e.newValue) { applyDarkMode(e.newValue); } });
      if (window.matchMedia) {
        const mq = window.matchMedia("(prefers-color-scheme: dark)");
        if (mq.addEventListener) { mq.addEventListener("change", () => { const current = localStorage.getItem("darkMode") || "system"; if (current === "system") applyDarkMode("system"); }); }
        else if (mq.addListener) { mq.addListener(() => { const current = localStorage.getItem("darkMode") || "system"; if (current === "system") applyDarkMode("system"); }); }
      }
    })();
  </script>

  <script>
    (function () {
      // Skip ALL video auto-pause logic on live stream pages (viewer + streamer)
      function isLivePage() {
        var p = window.location.pathname;
        return p.includes('/live/') || p.includes('/create-live');
      }

      // Re-check on every SPA navigation
      function shouldSkip() { return isLivePage(); }

      // 1. Handle tab switching — pause feed/snap videos only
      document.addEventListener("visibilitychange", () => {
        if (shouldSkip()) return;
        if (document.hidden) {
          document.querySelectorAll('video').forEach(vid => {
            if (!vid.paused) vid.pause();
          });
        }
      });

      // 2. Handle scrolling away — pause off-screen videos only
      const observer = new IntersectionObserver((entries) => {
        if (shouldSkip()) return;
        entries.forEach(entry => {
          const vid = entry.target;
          if (!entry.isIntersecting && !vid.paused) {
            vid.pause();
          }
        });
      }, { threshold: 0.0 });

      // 3. Watch DOM for new videos
      const mutationObserver = new MutationObserver((mutations) => {
        if (shouldSkip()) return;
        mutations.forEach(mutation => {
          mutation.addedNodes.forEach(node => {
            if (node.nodeType !== 1) return;
            if (node.tagName === 'VIDEO') observer.observe(node);
            else if (node.querySelectorAll) node.querySelectorAll('video').forEach(v => observer.observe(v));
          });
        });
      });

      mutationObserver.observe(document.body, { childList: true, subtree: true });
      document.querySelectorAll('video').forEach(v => observer.observe(v));
    })();
  </script>
