function getMediaUrlFromQuery() {
  const params = new URLSearchParams(window.location.search);
  return params.get("id");
}

function MediaViewer() {
  const url = getMediaUrlFromQuery();
  const isVideo = /\.(mp4|webm|ogg)$/i.test(url);
  const [zoom, setZoom] = React.useState(1);
  const [pos, setPos] = React.useState({ x: 0, y: 0 });
  const [dragging, setDragging] = React.useState(false);
  const dragStart = React.useRef({ x: 0, y: 0 });
  const mediaRef = React.useRef();

  // Reset when URL changes
 React.useEffect(() => {
    setZoom(1);
    setPos({ x: 0, y: 0 });
  }, [url]);

  // Handlers
  const zoomIn  = () => setZoom(z => Math.min(z + 0.25, 3));
  const zoomOut = () => setZoom(z => Math.max(z - 0.25, 0.5));
  const reset   = () => { setZoom(1); setPos({ x: 0, y: 0 }); };

  const startDrag = e => {
    e.preventDefault();
    setDragging(true);
    dragStart.current = {
      x: e.clientX - pos.x,
      y: e.clientY - pos.y
    };
  };
  const onDragging = e => {
    if (!dragging) return;
    setPos({
      x: e.clientX - dragStart.current.x,
      y: e.clientY - dragStart.current.y
    });
  };
  const endDrag = () => setDragging(false);

  // Touch equivalents
  const startTouch = e => {
    e.preventDefault();
    const t = e.touches[0];
    setDragging(true);
    dragStart.current = {
      x: t.clientX - pos.x,
      y: t.clientY - pos.y
    };
  };
  const onTouchMove = e => {
    if (!dragging) return;
    const t = e.touches[0];
    setPos({
      x: t.clientX - dragStart.current.x,
      y: t.clientY - dragStart.current.y
    });
  };

  // Download helper
  const download = async () => {
    try {
      const resp = await fetch(url, { mode: 'cors' });
      const blob = await resp.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = url.split('/').pop();
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(blobUrl);
    } catch {
      alert('Download failed.');
    }
  };

  if (!url) return (
    <div className="flex items-center justify-center h-screen bg-black text-white text-2xl">
      No media found
    </div>
  );

  return (
    <div
      className="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-50 overflow-hidden"
      onMouseMove={onDragging}
      onMouseUp={endDrag}
      onMouseLeave={endDrag}
      onTouchMove={onTouchMove}
      onTouchEnd={endDrag}
    >
      {/* Controls always on top */}
      <div className="absolute top-4 right-4 flex space-x-2 z-30">
        <button
          onClick={reset}
          className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded shadow"
        >
          Reset
        </button>
        <button
          onClick={zoomOut}
          className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded shadow"
        >
          – 
        </button>
        <button
          onClick={zoomIn}
          className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded shadow"
        >
          +
        </button>
        <button
          onClick={download}
          className="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded shadow"
        >
          Download
        </button>
        <button
          onClick={e => { e.stopPropagation(); history.back(); }}
          className="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded shadow"
        >
          ✕
        </button>
      </div>

      {/* Media wrapper: transforms only the media element */}
      <div
        className="relative z-20 cursor-grab"
        onMouseDown={startDrag}
        onTouchStart={startTouch}
        onClick={e => e.stopPropagation()}
      >
        {isVideo ? (
          <video
            src={url}
            autoPlay
            controls
            className="max-w-[90vw] max-h-[90vh] object-contain"
            style={{
              transform: `translate(${pos.x}px, ${pos.y}px) scale(${zoom})`,
              transition: dragging ? 'none' : 'transform 0.2s'
            }}
          />
        ) : (
          <img
            src={url}
            alt="Media"
            ref={mediaRef}
            className="max-w-[90vw] max-h-[90vh] object-contain select-none"
            draggable={false}
            style={{
              transform: `translate(${pos.x}px, ${pos.y}px) scale(${zoom})`,
              transition: dragging ? 'none' : 'transform 0.2s'
            }}
          />
        )}
      </div>
    </div>
  );
}

function PostViewer({ id }) {
  const [post, setPost]       = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [error, setError]     = React.useState("");
  const [groupInfo, setGroupInfo] = React.useState(null);
  const [denied, setDenied]   = React.useState(false);

  // Reactions state
  const [reactionsOpen, setReactionsOpen] = React.useState(null);
  const [reactionCounts, setReactionCounts] = React.useState({}); // postId -> { counts: {}, userReaction: null }

  async function fetchGroupLight(gid) {
    const res = await fetch(`/groups/${gid}/light?username=${localStorage.currentUser}`);
    if (res.status === 403) throw new Error("Access denied");
    if (!res.ok) throw new Error("Failed to fetch group info");
    return await res.json();
  }

  // Emoji palette for picker
  var REACTION_OPTIONS = [
  { reaction: "❤️", etext: "love" },
  { reaction: "😂", etext: "funny" },
  { reaction: "🔥", etext: "fire" },
  { reaction: "👍", etext: "like" },
  { reaction: "😮", etext: "surprised" },
  { reaction: "😢", etext: "sad" },
  { reaction: "👏", etext: "clap" },
  { reaction: "😡", etext: "angry" },
  { reaction: "🥰", etext: "adore" },
  { reaction: "🙌", etext: "celebrate" },
  { reaction: "💯", etext: "perfect" },
  { reaction: "🤔", etext: "thinking" },
  { reaction: "🤯", etext: "mindblown" },
  { reaction: "😎", etext: "cool" },
  { reaction: "🤩", etext: "amazed" },
  { reaction: "😴", etext: "boring" },
  { reaction: "😇", etext: "wholesome" },
  { reaction: "💔", etext: "heartbroken" },
  { reaction: "😅", etext: "awkward" },
  { reaction: "🙏", etext: "respect" }
];


  // compute grouped counts + user's reaction
  function computeReactionCounts(reactionsArray, currentUser) {
    var counts = {};
    var userReaction = null;
    if (!reactionsArray || !Array.isArray(reactionsArray)) return { counts: {}, userReaction: null };
    reactionsArray.forEach(function (r) {
      if (!r || !r.reaction) return;
      counts[r.reaction] = counts[r.reaction] || 0;
      counts[r.reaction] = counts[r.reaction] + 1;
      if (r.username === currentUser) {
        userReaction = r.reaction;
      }
    });
    return { counts: counts, userReaction: userReaction };
  }

  // Fallback fetch for reactions when post.reactions missing
  async function fetchReactionsForPost(postId) {
    try {
      var res = await fetch('/get-post-reactions?postId=' + encodeURIComponent(postId));
      if (!res.ok) throw new Error('Failed to fetch reactions');
      var data = await res.json(); // expect { reactions: [...] } or { counts: {...}, userReaction: '❤️' }
      if (data && data.reactions) {
        var computed = computeReactionCounts(data.reactions, localStorage.currentUser);
        setReactionCounts(function (prev) {
          var copy = Object.assign({}, prev);
          copy[String(postId)] = computed;
          return copy;
        });
      } else if (data && data.counts) {
        setReactionCounts(function (prev) {
          var copy = Object.assign({}, prev);
          copy[String(postId)] = { counts: data.counts, userReaction: data.userReaction || null };
          return copy;
        });
      }
    } catch (e) {
      console.error('Failed to load reactions for post', postId, e);
    }
  }

  React.useEffect(() => {
    async function load() {
      setLoading(true);
      setError("");
      setGroupInfo(null);
      setDenied(false);
      try {
        const res = await fetch(`/get-post?id=${encodeURIComponent(id)}`);
        if (!res.ok) throw new Error("Post not found");
        const data = await res.json();
        setPost(data);

        // populate reaction cache if reactions included
        try {
          if (data && data.reactions && Array.isArray(data.reactions)) {
            var comp = computeReactionCounts(data.reactions, localStorage.currentUser);
            setReactionCounts(function (prev) {
              var copy = Object.assign({}, prev);
              copy[String(data.id)] = comp;
              return copy;
            });
          } else {
            // fallback fetch once
            fetchReactionsForPost(data.id);
          }
        } catch (e) {}

        if (data.type && data.type.startsWith("group-post-")) {
          const gid = data.type.replace("group-post-", "");
          try {
            const gdata = await fetchGroupLight(gid);
            setGroupInfo(gdata);
          } catch (err) {
            if (err.message === "Access denied") {
              setDenied(true);
              return;
            }
            console.error("Failed to load group info:", err);
          }
        }
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    }
    load();
  }, [id]);

  // Optimistic reaction handler for single-post viewer
  function handleReactViewer(postId, reaction, etext) {
    var currentUser = localStorage.currentUser;
    // optimistic update to post.reactions
    setPost(function (p) {
      if (!p || p.id !== postId) return p;
      var newReactions = [];
      if (p.reactions && Array.isArray(p.reactions)) {
        newReactions = p.reactions.filter(function (r) { return r.username !== currentUser; });
      } else {
        newReactions = [];
      }
      var existing = (p.reactions || []).find(function (r) { return r.username === currentUser; });
      if (existing && existing.reaction === reaction) {
        // removal - do nothing (already filtered)
      } else {
        newReactions.push({ username: currentUser, type: "emoji", reaction: reaction, etext: etext });
      }
      return Object.assign({}, p, { reactions: newReactions });
    });

    // update local reactionCounts
    setReactionCounts(function (prev) {
      var copy = Object.assign({}, prev);
      var prevObj = copy[String(postId)] || { counts: {}, userReaction: null };
      try {
        var postNow = (post && post.id === postId) ? post : null;
        var reactionsArr = (postNow && postNow.reactions) ? postNow.reactions.slice() : [];
        reactionsArr = reactionsArr.filter(function (r) { return r.username !== currentUser; });
        var existed = null;
        if (postNow && postNow.reactions) existed = postNow.reactions.find(function (r) { return r.username === currentUser; });
        if (existed && existed.reaction === reaction) {
          // removal case - nothing to add
        } else {
          reactionsArr.push({ username: currentUser, type: "emoji", reaction: reaction, etext: etext });
        }
        copy[String(postId)] = computeReactionCounts(reactionsArr, currentUser);
      } catch (e) {
        if (prevObj.userReaction === reaction) {
          prevObj.userReaction = null;
          prevObj.counts[reaction] = Math.max(0, (prevObj.counts[reaction] || 1) - 1);
        } else {
          if (prevObj.userReaction) {
            prevObj.counts[prevObj.userReaction] = Math.max(0, (prevObj.counts[prevObj.userReaction] || 1) - 1);
          }
          prevObj.userReaction = reaction;
          prevObj.counts[reaction] = (prevObj.counts[reaction] || 0) + 1;
        }
        copy[String(postId)] = prevObj;
      }
      return copy;
    });

    // send to server
    fetch('/react-post', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ postId: postId, username: localStorage.currentUser, reaction: reaction, etext: etext }),
    }).then(function (res) {
      if (!res.ok) {
        // server rejected - refetch accurate reactions
        fetchReactionsForPost(postId);
      } else {
        res.json().then(function (data) {
          if (data && data.reactions) {
            var computed = computeReactionCounts(data.reactions, localStorage.currentUser);
            setReactionCounts(function (prev) {
              var copy = Object.assign({}, prev);
              copy[String(postId)] = computed;
              return copy;
            });
            // refresh post.reactions to server truth if provided
            setPost(function (p) {
              if (!p || p.id !== postId) return p;
              return Object.assign({}, p, { reactions: data.reactions });
            });
          }
        }).catch(function () {});
      }
    }).catch(function () {
      setTimeout(function () { fetchReactionsForPost(postId); }, 1500);
    });
  }

  function handleLike() {
    if (!post) return;
    setPost(p => (Object.assign({}, p, {
      likes: p.likes.includes(localStorage.currentUser)
        ? p.likes.filter(function (u) { return u !== localStorage.currentUser; })
        : p.likes.concat([localStorage.currentUser])
    })));
    fetch("/like-post", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        postId: post.id,
        username: localStorage.currentUser
      })
    }).catch(() => {
      setPost(p => (Object.assign({}, p, {
        likes: p.likes.includes(localStorage.currentUser)
          ? p.likes.filter(function (u) { return u !== localStorage.currentUser; })
          : p.likes.concat([localStorage.currentUser])
      })));
    });
  }

  async function handleComment(text) {
    const t = text.trim();
    if (!t || !post) return;
    setPost(p => (Object.assign({}, p, { comments: p.comments.concat([{ username: localStorage.currentUser, text: t }]) })));
    try {
      await fetch("/add-comment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ postId: post.id, username: localStorage.currentUser, comment: t })
      });
    } catch {}
  }

  async function handlePollVote(optionId) {
    if (!post || post.type !== 'poll') return;
    const current = localStorage.currentUser;
    const votedOption = post.options.find(function (o) { return o.votes.includes(current); });
    const votedId = votedOption ? votedOption.id : null;
    const updatedOptions = post.options.map(function (o) {
      var votes = o.votes.filter(function (v) { return v !== current; });
      if (o.id === optionId && votedId !== optionId) votes.push(current);
      return Object.assign({}, o, { votes: votes });
    });
    setPost(function (prev) { return Object.assign({}, prev, { options: updatedOptions }); });
    try {
      await fetch("/vote-poll-option", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ postId: post.id, optionId: optionId, username: current })
      });
    } catch (err) {
      console.error("Voting failed", err);
    }
  }

  if (loading) {
    return (
      <div className="flex justify-center items-center h-full p-6">
        <svg className="animate-spin w-10 h-10 text-blue-600" viewBox="0 0 24 24">
          <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
          <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
        </svg>
      </div>
    );
  }
  if (error) return <div className="p-6 text-center text-red-500">{error}</div>;
  if (denied) return <div className="p-6 text-center text-yellow-600">Access denied to this group post</div>;
  if (!post) return <div className="p-6 text-center text-gray-500">No post to display.</div>;

  var liked = post.likes.includes(localStorage.currentUser);
  var rcObj = reactionCounts[String(post.id)] || { counts: {}, userReaction: null };
  var rcCounts = rcObj.counts || {};
  var rcArr = Object.keys(rcCounts).map(function (k) { return { reaction: k, count: rcCounts[k] }; });
  rcArr.sort(function (a, b) { return b.count - a.count; }); // highest first
  var shownReactions = rcArr.slice(0, 6);

  return (
    <div className="bg-white md:mx-4 md:my-6 rounded-2xl shadow-md border border-gray-100 overflow-hidden">
      {/* Header */}
      <div className="flex items-center gap-3 px-6 py-5">
        <div className="relative w-12 h-12">
          {/* User avatar */}
          <img
            src={profile(post.username).profile_pic}
            className="w-10 h-10 rounded-full object-cover absolute left-0 top-1 z-10 border-2 border-white cursor-pointer"
            loading="lazy"
            alt={post.username}
            onClick={() => Lexum.navigate(`/@${post.username}`)}
          />
          {/* Group avatar */}
          {groupInfo && (
            <img
              src={groupInfo.profile_pic}
              className="w-10 h-10 rounded-full object-cover absolute left-5 top-1 border-2 border-white cursor-pointer"
              loading="lazy"
              style={{ marginTop: '15px' }}
              alt={groupInfo.name}
              onClick={() => Lexum.navigate(`/group/${groupInfo.id}`)}
            />
          )}
          {post.type === 'live_ended' && (
            <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] px-2 py-[1px] rounded-full font-semibold whitespace-nowrap">
              Was Live
            </span>
          )}
        </div>
        <div className="ml-14">
          <p className="font-semibold text-gray-900">
            <span
              className="hover:underline cursor-pointer"
              onClick={() => Lexum.navigate(`/@${post.username}`)}
            >
              {profile(post.username).fullname}
            </span>
            {groupInfo && (
              <>
                {" / "}
                <span
                  className="text-blue-600 hover:underline cursor-pointer"
                  onClick={() => Lexum.navigate(`/group/${groupInfo.id}`)}
                >
                  {groupInfo.name}
                </span>
              </>
            )}
            {post.activities && (
              <span className="text-sm text-gray-600 ml-1">
                is feeling {post.activities}
              </span>
            )}
          </p>
          <p className="text-xs text-gray-500">
            {timeAgo(post.created_at)}
          </p>
        </div>
      </div>

    {/* Text */}
    {post.text && (
        <div className="px-6 pb-4 text-gray-800 leading-relaxed text-[15px]">
          <SafeHTML html={post.text} />
        </div>
      )}
      {post.type === "poll" && post.options && (
  <div className="px-6 pb-4 space-y-2">
    {(() => {
      const totalVotes = post.options.reduce(function (sum, o) { return sum + o.votes.length; }, 0);
      const currentUser = localStorage.currentUser;

      return post.options.map((opt) => {
        const voted = opt.votes.includes(currentUser);
        const percent = totalVotes > 0 ? Math.round((opt.votes.length / totalVotes) * 100) : 0;

        return (
          <button
            key={opt.id}
            onClick={() => handlePollVote(opt.id)}
            className={`
              relative w-full flex items-center justify-between px-4 py-2 text-sm rounded-full border overflow-hidden
              transition font-medium
              ${voted ? "bg-blue-600 text-white border-blue-600" : "bg-gray-100 text-gray-800 hover:bg-gray-200"}
            `}
            style={{ position: "relative", zIndex: 1 }}
          >
            {/* Bar behind content */}
            <div
              className="absolute inset-0 rounded-full"
              style={{
                width: `${percent}%`,
                backgroundColor: voted
                  ? "rgba(37, 99, 235, 0.3)"
                  : "rgba(147, 197, 253, 0.4)",
                zIndex: 0,
              }}
            ></div>

            {/* Text and stats */}
            <span className="relative z-10">{opt.text}</span>
            <span className="relative z-10 ml-2 text-xs">
              {opt.votes.length} • {percent}%
            </span>
          </button>
        );
      });
    })()}

    <div className="text-xs text-gray-500 pt-1">
      {post.options.reduce(function (a, b) { return a + b.votes.length; }, 0)} total votes • tap to switch vote
    </div>
  </div>
)}

      {/* Media */}
      {post.media && post.media.length > 0 && (
        <div className="px-6 pb-4 space-y-4">
          {post.media.map((url, i) =>
            /\.(mp4|webm|ogg)$/i.test(url) ? (

            ) : (
              <img key={i} src={url} className="w-full object-cover rounded-xl border border-gray-200" loading="lazy" />
            )
          )}
        </div>
      )}
<div class="p-3">
  <div className="flex items-center gap-2 relative">
    {(() => {
      if (shownReactions.length === 0) {
        return (
          <button
            onClick={(e) => {

            <span className="mr-1">{s.reaction}</span>
            <span>{s.count}</span>

        );
      });
    })()}

    {/* picker toggle */}
    <div className="relative">
      <button
        onClick={(e) => {
          e.stopPropagation();
          setReactionsOpen(post.id);
        }}
        className="px-2 py-1 rounded-full bg-gray-100 hover:bg-gray-200 transition text-lg"
        aria-haspopup="true"
        aria-expanded={reactionsOpen === post.id}
      >
        +
      </button>

      {/* Reaction Modal */}
      {reactionsOpen === post.id && (
        <div
          onClick={(e) => e.stopPropagation()}

        >
          <div

            {REACTION_OPTIONS.map((opt) => {

                  }}
                  className={
                    "px-3 py-2 rounded-lg text-sm transition w-full flex items-center gap-2 " +
                    (active ? "bg-blue-600 text-white" : "bg-gray-100 hover:bg-gray-200")

                  <span className="text-lg">{opt.reaction}</span>

                </button>

        </div>
      )}
    </div>
  </div>     
  
  </div>
      {/* Actions - LIKE + REACTIONS + COMMENT */}
      <div className="flex justify-between px-6 py-4 border-t border-gray-100 text-sm items-center">
        <div className="flex items-center gap-3">

  </div>

        <button

function SparkForm({ onSubmit }) {
  const [file, setFile]       = React.useState(null);
  const [preview, setPreview] = React.useState("");
  const [caption, setCaption] = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const isValid = file && true;

  // File preview handler
  React.useEffect(() => {
    if (!file) return setPreview("");
    const url = URL.createObjectURL(file);
    setPreview(url);
    return () => URL.revokeObjectURL(url);
  }, [file]);

  const handleFileChange = e => {
    const f = e.target.files[0];
    if (f && /(image|video)/.test(f.type)) setFile(f);
  };

  const handleSubmit = async e => {
    e.preventDefault();
    if (!isValid) return;
    setLoading(true);
    const fd = new FormData();
    fd.append("username", localStorage.currentUser);
    fd.append("caption", caption);
    fd.append("media", file);
    try {
      await onSubmit(fd);
      setCaption(""); setFile(null);
    } catch (err) {
      console.error(err);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="w-full px-4 sm:px-8 lg:px-16 py-8">
      <div className="max-w-2xl mx-auto rounded-2xl bg-white shadow-xl ring-1 ring-gray-200 p-6 sm:p-8 transition-all duration-300">
        <h2 className="text-2xl sm:text-3xl font-bold text-gray-800 mb-6">✨ Create a Spark</h2>
        
        <form onSubmit={handleSubmit} className="space-y-6">

          {/* File Input */}
          <div>
            <label className="block text-sm font-semibold text-gray-700 mb-2">
              Media <span className="text-red-500">*</span>
            </label>
            <input
              type="file"
              accept="image/*,video/*"
              onChange={handleFileChange}
              className="block w-full text-sm
                         file:mr-4 file:py-2 file:px-4
                         file:rounded-full file:border-0
                         file:text-sm file:font-semibold
                         file:bg-gradient-to-r file:from-purple-500 file:to-pink-500
                         hover:file:from-purple-600 hover:file:to-pink-600
                         text-gray-800 transition-all"
            />
          </div>

          {/* Preview */}
          {preview && (
            <div className="relative w-full h-56 bg-gray-100 rounded-xl overflow-hidden shadow-md">
              {file && file.type.startsWith("image") ? (
                <img src={preview} alt="preview" className="object-cover w-full h-full" />
              ) : (
                <video src={preview} className="w-full h-full object-cover" controls />
              )}
              <button
                type="button"

          {/* Caption */}

function ConnectButton({ targetUsername, currentUsername, onUpdate }) {
    const [btnLoading, setBtnLoading] = React.useState(true);
    const [state, setState] = React.useState(null);

    React.useEffect(() => {
      let mounted = true;
      async function fetchProfile() {
        try {
          const res = await fetch(`/profile/${encodeURIComponent(targetUsername)}`);
          const data = await res.json();
          if (!mounted) return;
          const isFriend = Array.isArray(data.friends) && data.friends.includes(currentUsername);
          const isFollowing = Array.isArray(data.followers) && data.followers.includes(currentUsername);
          const profileType = (data.profile_type || "").toLowerCase();
          setState(profileType === "individual" ? (isFriend ? "friended" : "not_friended") : (isFollowing ? "following" : "not_following"));
        } catch (err) {
          console.error(err);
        } finally {
          if (mounted) setBtnLoading(false);
        }
      }
      fetchProfile();
      return () => { mounted = false; };
    }, [targetUsername, currentUsername]);

    const handleClick = async () => {
      if (btnLoading || !state) return;
      setBtnLoading(true);
      try {
        const res = await fetch("/connect", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ currentUsername, targetUsername }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to connect");
        const nextState = {
          friended: "not_friended",
          not_friended: "friended",
          following: "not_following",
          not_following: "following",
        }[state];
        setState(nextState);
        onUpdate?.(nextState);
      } catch (err) {
        alert(err.message || "Connection error");
      } finally {
        setBtnLoading(false);
      }
    };

    const labelMap = { friended: "Friends", not_friended: "Add Friend", following: "Unfollow", not_following: "Follow" };
    const isActive = state === "friended" || state === "following";

    return (
      <button
        onClick={handleClick}
        disabled={btnLoading}
        className={`rounded-full px-4 py-2 text-sm font-medium shadow-md focus:outline-none transition-transform duration-150 transform-gpu
          ${btnLoading ? "bg-gray-200 text-gray-500 cursor-wait" : isActive ? "bg-[var(--dodger)] text-white hover:scale-[1.02]" : "bg-white border border-[var(--dodger)] text-[var(--dodger)] hover:bg-[rgba(30,144,255,0.06)]"}`}
      >
        {btnLoading ? "..." : labelMap[state] || "Connect"}
      </button>
    );
  }

  function ProfilePage({ username }) {
  // --- STATE MANAGEMENT ---
  const [profile, setProfile] = React.useState(null);
  const [posts, setPosts] = React.useState([]);

  // We split "Keys" (lists of usernames) from "Data" (full profiles) to prevent crashing
  const [connectionKeys, setConnectionKeys] = React.useState([]); 
  const [followingKeys, setFollowingKeys] = React.useState([]);
  
  // These maps store the actual loaded user data
  const [connectionsMap, setConnectionsMap] = React.useState({});
  const [followingMap, setFollowingMap] = React.useState({});

  // Loading states
  const [loading, setLoading] = React.useState(true);
  const [loadingConnections, setLoadingConnections] = React.useState(false);
  const [loadingFollowing, setLoadingFollowing] = React.useState(false);

  const [error, setError] = React.useState("");
  const [activeTab, setActiveTab] = React.useState("posts");
  const [showFullBio, setShowFullBio] = React.useState(false);
  const [viewMode, setViewMode] = React.useState("grid");


  const randomGradient = React.useCallback(() => {
    const colors = ["#FF6B6B", "#4ECDC4", "#45B7D1", "#96CEB4", "#FFEEAD", "#D4A5A5", "#9B59B6", "#3498DB", "#E74C3C", "#2ECC71"];
    const color1 = colors[Math.floor(Math.random() * colors.length)];
    let color2 = colors[Math.floor(Math.random() * colors.length)];
    while (color2 === color1) color2 = colors[Math.floor(Math.random() * colors.length)];
    return `linear-gradient(135deg, ${color1}, ${color2})`;
  }, []);

  const formatNumber = (value) => {
    const num = Number(value) || 0;
    if (num >= 1000000) return (Math.round((num / 1000000) * 10) / 10).toFixed((Math.round((num / 1000000) * 10) % 10 === 0) ? 0 : 1) + "M";
    if (num >= 1000) return (Math.round((num / 1000) * 10) / 10).toFixed((Math.round((num / 1000) * 10) % 10 === 0) ? 0 : 1) + "K";
    return num.toString();
  };

  const initialsAvatar = (name = "", size = 256) => {
    const initials = (name || "U").trim().split(/\s+/).slice(0, 2).map(n => n[0].toUpperCase()).join("");
    const bg = "#E2E8F0";
    const fg = "#111827";
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${size}' height='${size}'><rect width='100%' height='100%' fill='${bg}'/><text x='50%' y='50%' dy='.1em' font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial' font-size='${Math.round(size/2.8)}' fill='${fg}' text-anchor='middle' alignment-baseline='middle'>${initials}</text></svg>`;
    return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
  };

  const getTruncatedBio = (bio) => {
    if (!bio) return { text: "", needsMore: false };
    const safeBio = String(bio);
    const lines = safeBio.split("\n");
    const firstTwoLines = lines.slice(0, 2).join("\n");
    if (safeBio.length <= 100 && lines.length <= 2) return { text: safeBio, needsMore: false };
    const truncated = firstTwoLines.length > 100 ? firstTwoLines.slice(0, 100) + "..." : firstTwoLines;
    return { text: truncated, needsMore: lines.length > 2 || firstTwoLines.length > 100 };
  };

  const formatDate = (value) => {
    const t = value || value === 0 ? value : null;
    const d = t ? new Date(t) : null;
    if (!d || isNaN(d)) return "";
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) + " • " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  };

  // --- MOBILE SAFE FETCHING ---
  // This helper processes requests in small chunks (5) to avoid "Insufficient Resources"
  const fetchInBatches = async (items, fetchFn, batchSize = 5) => {
    const results = [];
    for (let i = 0; i < items.length; i += batchSize) {
      const batch = items.slice(i, i + batchSize);
      const batchResults = await Promise.all(
        batch.map(item => fetchFn(item).catch(e => null)) 
      );
      results.push(...batchResults);
    }
    return results.filter(Boolean);
  };

  // --- EFFECT 1: INITIAL LOAD (Profile + Posts Only) ---
  React.useEffect(() => {
    let mounted = true;
    async function loadCoreData() {
      setLoading(true);
      try {
        const pRes = await fetch(`/profile/${encodeURIComponent(username)}`);
        if (!pRes.ok) throw new Error("Failed to load profile");
        const pData = await pRes.json();

        const qRes = await fetch(`/get-user-posts?username=${encodeURIComponent(username)}`);
        if (!qRes.ok) throw new Error("Failed to load posts");
        const qData = await qRes.json();

        if (!mounted) return;
        setProfile(pData);
        setPosts(Array.isArray(qData) ? qData : []);

        // Just store the Usernames (Keys), don't fetch full profiles yet
        const isOrg = (pData.profile_type || "").toLowerCase() === "organisation";
        const cKeys = isOrg ? (Array.isArray(pData.followers) ? pData.followers : []) : (Array.isArray(pData.friends) ? pData.friends : []);
        const fKeys = Array.isArray(pData.following) ? pData.following : [];

        setConnectionKeys(cKeys);
        setFollowingKeys(fKeys);
      } catch (err) {
        if (!mounted) return;
        console.error(err);
        setError(String(err.message || err));
      } finally {
        if (mounted) setLoading(false);
      }
    }
    loadCoreData();
    return () => { mounted = false; };
  }, [username]);

  // --- EFFECT 2: LAZY LOAD CONNECTIONS ---
  React.useEffect(() => {
    if (activeTab === "connections" && connectionKeys.length > 0 && Object.keys(connectionsMap).length === 0 && !loadingConnections) {
      let active = true;
      const loadConnections = async () => {
        setLoadingConnections(true);
        const users = await fetchInBatches(connectionKeys, async (u) => {
            const res = await fetch(`/profile/${encodeURIComponent(u)}`);
            return res.ok ? res.json() : null;
        }, 5); // Max 5 requests at a time
        
        if (active) {
          const newMap = {};
          users.forEach(u => { if(u) newMap[u.username] = u; });
          setConnectionsMap(newMap);
          setLoadingConnections(false);
        }
      };
      loadConnections();
      return () => { active = false; };
    }
  }, [activeTab, connectionKeys, connectionsMap, loadingConnections]);

  // --- EFFECT 3: LAZY LOAD FOLLOWING ---
  React.useEffect(() => {
    if (activeTab === "following" && followingKeys.length > 0 && Object.keys(followingMap).length === 0 && !loadingFollowing) {
      let active = true;
      const loadFollowing = async () => {
        setLoadingFollowing(true);
        const users = await fetchInBatches(followingKeys, async (u) => {
            const res = await fetch(`/profile/${encodeURIComponent(u)}`);
            return res.ok ? res.json() : null;
        }, 5); // Max 5 requests at a time
        
        if (active) {
          const newMap = {};
          users.forEach(u => { if(u) newMap[u.username] = u; });
          setFollowingMap(newMap);
          setLoadingFollowing(false);
        }
      };
      loadFollowing();
      return () => { active = false; };
    }
  }, [activeTab, followingKeys, followingMap, loadingFollowing]);

  // --- SUB-COMPONENTS ---

            const content = p.text || p.content || "";
            const author = p.username || p.author || profile.username;
            const create = p.created_at || p.createdAt || p.timestamp || p.date || null;
            const created = timeAgo(create);
            return (
              <a
                key={p.id || idx}
                href={`/post/${p.id || ""}`}
                className="block rounded overflow-hidden bg-white border border-gray-200 hover:border-gray-300 transition-colors duration-200"
              >
                <div className="h-48 sm:h-40 bg-gray-100 flex items-center justify-center relative overflow-hidden">
                  {media ? (
                    <div className="absolute inset-0 bg-center bg-cover" style={{ backgroundImage: `url(${media})` }} />
                  ) : (
                    <div className="p-3 text-sm text-gray-700 flex items-start h-full w-full">
                      <p className="line-clamp-4">{content || "—"}</p>

                </div>

  if (loading) {

  const followingList = followingKeys.map(k => followingMap[k]).filter(Boolean);

const STORAGE_KEY = "_tm_ai_b7x2025";

function TextmobAiChat() {
  const [messages, setMessages] = React.useState([]);
  const [input, setInput] = React.useState('');
  const endRef = React.useRef();

 React.useEffect(() => {
    const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    setMessages(history);
  }, []);

 React.useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
    if (endRef.current) endRef.current.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  const sendMessage = async () => {
    if (!input.trim()) return;

    const updated = [...messages, { role: 'user', content: input }];
    setMessages(updated);
    setInput('');

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: updated })
      });

      if (!res.ok) throw new Error("Network response was not ok");

      const data = await res.json();
      const reply = data.reply;
      setMessages(prev => [...prev, reply]);
    } catch (err) {
      setMessages(prev => [...prev, {
        role: 'bot',
        content: '⚠️ Unable to connect to server. Please check if backend is running.'
      }]);
    }
  };

  const clearChat = () => {
    localStorage.removeItem(STORAGE_KEY);
    setMessages([]);
  };

  const renderMarkdown = (text) => {
    const html = marked.parse(text);
    return <div className="markdown text-sm sm:text-base leading-relaxed" dangerouslySetInnerHTML={{ __html: html }} />;
  };

  return (
    <div
  className="w-full sm:max-w-md sm:h-[79vh] sm:rounded-2xl shadow-xl bg-white border border-blue-100 p-4 sm:p-6 sm:mt-6 sm:mb-6 flex flex-col ml-0 sm:ml-4"
>

      <div className="flex items-center justify-between mb-3">
        <h1 className="text-xl font-semibold text-blue-600">Textmob AI 💬</h1>
        <button onClick={clearChat} className="text-sm text-red-500 hover:text-red-700">Clear Chat</button>
      </div>

      <div className="flex-1 overflow-y-auto space-y-3 p-2 bg-gray-50 rounded-xl border" style={{ maxHeight: '70vh' }}>
        {messages.map((msg, index) => (
          <div
            key={index}
            className={`px-4 py-3 rounded-2xl max-w-[80%] transition-none ${
              msg.role === 'user'
                ? 'bg-blue-600 text-white ml-auto'
                : 'bg-white border border-gray-200 text-gray-800 mr-auto'
            }`}
          >
            {renderMarkdown(msg.content)}
          </div>
        ))}
        <div ref={endRef} />
      </div>

      <div className="mt-4 flex gap-2">
        <input
          className="flex-1 p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring focus:ring-blue-400"
          placeholder="Talk to Textmob AI..."
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={(e) => e.key === 'Enter' && sendMessage()}
        />
        <button
          className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl transition"
          onClick={sendMessage}
        >
          Send
        </button>
      </div>
    </div>
  );
}

      setRecipients([]);
      setSearchResults([]);
      setAmount('');
      setModalOpen(false);
    } catch (e) {
      setStatus('Error: ' + e.message);
    } finally {
      setSending(false);
    }
  };

  // ---------- Earn flow: open link, wait >= MIN_STAY_MS, then POST to server ----------
  var [claiming, setClaiming] = React.useState(false);

  function makeClaimId() {
    return GAME_ID + '|' + Date.now() + '|' + Math.floor(Math.random() * 1000000);
  }

  function startAdClaim() {
    if (!currentUserId) {
      setStatus('You must be logged in to claim rewards');
      return;
    }
    if (claiming) {
      setStatus('Claim in progress');
      return;
    }

    var claimId = makeClaimId();

    // If this exact claim has somehow been awarded already in this session, skip
    if (awardedRef.current.has(claimId)) {
      setStatus('Claim already awarded for this session');
      return;
    }

    setClaiming(true);
    setStatus('Opening reward link — stay at least 10 seconds then return');

    // record leave time
    var leftAt = Date.now();

    // open monetag smartlink in new tab/window
    var win = window.open(SMARTLINK, '_blank');

    // mark claim pending
    pendingRef.current.add(claimId);

    var awarded = false;

    function attemptAward() {
      if (awarded) return;
      var now = Date.now();
      var stayed = now - leftAt;
      if (stayed >= MIN_STAY_MS) {
        awardClaimToServer(claimId);
        awarded = true;
      } else {
        setStatus('Returned too quickly — stay at least 10 seconds to earn');
        pendingRef.current.delete(claimId);
        setClaiming(false);
      }
      cleanup();
    }

    function onVisibility() {
      if (document.visibilityState === 'visible') {
        attemptAward();
      }
    }
    function onFocus() {
      attemptAward();
    }

    document.addEventListener('visibilitychange', onVisibility);
    window.addEventListener('focus', onFocus);

    // fallback timeout: stop waiting after 3 minutes
    var maxTimer = setTimeout(function() {
      if (!awarded) {
        setStatus('No valid return detected — try again');
        pendingRef.current.delete(claimId);
        setClaiming(false);
      }
      cleanup();
    }, 3 * 60 * 1000);

    function cleanup() {
      clearTimeout(maxTimer);
      try { document.removeEventListener('visibilitychange', onVisibility); } catch (e) {}
      try { window.removeEventListener('focus', onFocus); } catch (e) {}
    }
  }

  // POST to your existing game reward endpoint to award coins server-side
  async function awardClaimToServer(claimId) {
    setStatus('Confirming reward with server…');
    try {
      var res = await fetch('/t/claim-game-reward', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUserId, gameId: GAME_ID, coins: COINS, claimId: claimId })
      });
      var js = null;
      try { js = await res.json(); } catch (e) { js = null; }
      if (!res.ok) {
        var errText = js && js.error ? js.error : (js && js.message ? js.message : 'Server error');
        throw new Error(errText);
      }
      // success path: server returns balance or message
      if (js && (typeof js.balance === 'number' || typeof js.newBalance === 'number')) {
        var newBal = (typeof js.balance === 'number') ? js.balance : js.newBalance;
        setBalance(newBal);
      } else if (js && typeof js.balance !== 'number') {
        // fallback: re-fetch wallet
        var w = await fetch('/t/wallet?userId=' + encodeURIComponent(currentUserId));
        var wd = await w.json();
        setBalance(wd.mobcoins || 0);
      }
      awardedRef.current.add(claimId);
      pendingRef.current.delete(claimId);
      setStatus((js && js.message) ? js.message : ('You earned +' + COINS + ' Mobcoins'));
    } catch (e) {
      pendingRef.current.delete(claimId);
      setStatus('Claim failed: ' + (e.message || e));
    } finally {
      setClaiming(false);
    }
  }

  // ---------- UI (wallet + quick payment icons + earn button) ----------
  return (
    <div className="min-h-screen bg-gray-100 p-4 sm:p-6 flex flex-col items-center">
      <div className="w-full max-w-md">

                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0070ba" strokeWidth="1.5"><path d="M7 7h4l-1 10h-3z"/><path d="M11 7h6a2 2 0 0 1 2 2v3" /></svg>

/* ---------------- CreateSnapModal (re-themed & accessible) ---------------- 
   - Props: isOpen, onClose, username, profile, repostData, onPosted, alert 
   - Posts multipart/form-data to /create-snap 
------------------------------------------------------------------------------ */
const CreateSnapModal = ({ isOpen, onClose, username, profile, repostData, onPosted, alert }) => {
  const [text, setText] = React.useState('');
  const [media, setMedia] = React.useState(null);
  const [error, setError] = React.useState(null);
  const [uploading, setUploading] = React.useState(false);
  const [progress, setProgress] = React.useState(0);
  const fileInputRef = React.useRef(null);

  React.useEffect(function () {
    if (!isOpen) {
      setText('');
      setMedia(null);
      setError(null);
      setUploading(false);
      setProgress(0);
    }
  }, [isOpen]);

  function validateFile(file) {
    if (!file) return false;
    if (file.size > 40 * 1024 * 1024) { setError('Video must be under 40MB'); return false; }
    if (String(file.type).indexOf('video/') !== 0) { setError('Please upload a video file'); return false; }
    setError(null);
    return true;
  }

  function onFileChange(e) {
    var f = e && e.target && e.target.files ? e.target.files[0] : null;
    if (!f) return;
    if (validateFile(f)) setMedia(f);
  }

  // XHR upload to get progress reliably
  function uploadWithProgress(formData, cb) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/create-snap');
      xhr.upload.onprogress = function (ev) {
        if (ev.lengthComputable) {
          var p = Math.round((ev.loaded / ev.total) * 100);
          setProgress(p);
        }
      };
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var json = JSON.parse(xhr.responseText || '{}');
            resolve(json);
          } catch (e) { resolve({}); }
        } else {
          reject(new Error('Upload failed'));
        }
      };
      xhr.onerror = function (err) { reject(err); };
      xhr.send(formData);
    });
  }

  async function handleSubmit(e) {
    e && e.preventDefault();
    if (!media) { setError('Please attach a video before posting.'); return; }
    setError(null);
    setUploading(true);
    var fd = new FormData();
    fd.append('username', username);
    fd.append('text', text || '');
    fd.append('visibility', 'public');
    fd.append('media', media);

    try {
      var data = await uploadWithProgress(fd);
      setUploading(false);
      setProgress(100);
      if (typeof onPosted === 'function') onPosted(data);
      onClose();
      alert && alert('Snap posted ✅');
    } catch (err) {
      console.error('Upload error', err);
      setUploading(false);
      setError('Upload failed. Please try again.');
    }
  }

  if (!isOpen) return null;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center">
      <div className="absolute inset-0 bg-black/60" onClick={onClose} />
      <form onSubmit={handleSubmit} className="relative bg-white w-full max-w-md rounded-lg p-4 z-40">
        <button type="button" onClick={onClose} className="absolute right-3 top-3 text-gray-600">✕</button>
        <h3 className="text-lg font-semibold mb-2">Create Snap</h3>
        <textarea value={text} onChange={function (e) { setText(e.target.value); }} placeholder="What's happening?" rows="3" className="w-full border rounded p-2 mb-2" />
        <div onClick={function () { if (fileInputRef.current) fileInputRef.current.click(); }} className="border-dashed border p-3 rounded text-center cursor-pointer mb-2">
          <input ref={fileInputRef} type="file" accept="video/*" className="hidden" onChange={onFileChange} />
          {media ? <div className="text-sm">{media.name} • {(media.size / (1024 * 1024)).toFixed(1)} MB</div> : <div className="text-sm text-gray-600">Click or drop a video (max 40MB)</div>}
        </div>
        {error && <div className="text-sm text-red-500 mb-2">{error}</div>}
        {uploading && <div className="text-sm mb-2">Uploading: {progress}%</div>}
        {uploading && <div className="h-1 bg-gray-200 rounded mb-2"><div className="h-1 bg-blue-500 rounded" style={{ width: progress + '%' }} /></div>}
        <div className="flex gap-2">
          <button type="submit" disabled={uploading} className="flex-1 bg-blue-600 text-white px-3 py-2 rounded">{uploading ? 'Posting...' : 'Post Snap'}</button>
          <button type="button" onClick={function () { setText(''); setMedia(null); setError(null); }} className="px-3 py-2 border rounded">Reset</button>
        </div>
      </form>
    </div>
  );
};

/* ---------------- SnapCard (lazy poster with IO) ---------------- */
const SnapCard = ({ snap, profile, onOpen }) => {
  const imgRef = React.useRef(null);
  const [poster, setPoster] = React.useState(snap.poster || snap.thumbnail || null);

  React.useEffect(() => {
    let observer;
    let elem = imgRef.current;
    if (!elem) return;
    // IntersectionObserver to lazy load
    observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          if (!poster && snap.thumbnail) {
            setPoster(snap.thumbnail);
          }
          observer.disconnect();
        });
      },
      { rootMargin: "200px", threshold: 0.1 }
    );
    observer.observe(elem);
    return () => {
      try {
        observer && observer.disconnect();
      } catch (e) {}
    };
  }, [snap, poster]);

  return (
    <div
      onClick={() => onOpen(snap.id)}
      ref={imgRef}
      className="bg-white rounded-lg overflow-hidden shadow-sm hover:shadow-lg transform hover:-translate-y-1 transition-all duration-220 cursor-pointer focus:outline-none"
      role="button"
      tabIndex={0}
      onKeyDown={(e) => (e.key === "Enter" || e.key === " ") && onOpen(snap.id)}
      aria-label={`Open snap by ${profile.fullname}`}
    >
      <div className="relative" style={{ aspectRatio: "9/16", backgroundColor: "#f8fafc" }}>
        {poster ? (
          <img src={poster} alt={snap.text || "snap"} className="object-cover w-full h-full" />
        ) : (
          <div className="w-full h-full flex items-center justify-center bg-gray-100">
            <div className="flex items-center justify-center w-14 h-14 rounded-full bg-gradient-to-br from-blue-500 to-sky-400 shadow-md" aria-hidden>
              <svg className="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z" />
              </svg>
            </div>
          </div>

          </svg>
          <span className="text-xs text-gray-700">{snap.likes ? snap.likes.length : 0}</span>
        </div>
        {/* creator avatar */}

/* ---------------- PlayerSingle ---------------- */
const PlayerSingle = ({ snap, username, isActive, onLike }) => {
  const videoRef = React.useRef(null);
  const containerRef = React.useRef(null);
  const [isPlaying, setIsPlaying] = React.useState(false);
  const [muted, setMuted] = React.useState(false);
  const [progress, setProgress] = React.useState(0);
  const [localSnap, setLocalSnap] = React.useState(snap);
  const [heartAnimations, setHeartAnimations] = React.useState([]);
  const [showComments, setShowComments] = React.useState(false);
  const [text, setText] = React.useState('');

  // keep local copy in sync
  React.useEffect(function () {
    setLocalSnap(snap);
  }, [snap]);

  // IntersectionObserver drives lazy load / autoplay
  React.useEffect(function () {
    var v = videoRef.current;
    var node = containerRef.current;
    if (!node || !v) return undefined;

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          // attach src only when about to play
          if (!v.src) v.src = (localSnap && localSnap.media && localSnap.media[0]) || '';
          // only autoplay if parent says active
          if (isActive) {
            v.play().catch(function () {});
            setIsPlaying(true);
          }
        } else {
          // pause and revert small memory
          try { v.pause(); } catch (e) {}
          setIsPlaying(false);
        }
      });
    }, { threshold: 0.5 });

    io.observe(node);
    return function cleanup() {
      try { io.disconnect(); } catch (e) {}
    };
  }, [localSnap, isActive]);

  // keep playing state in sync with isActive
  React.useEffect(function () {
    var v = videoRef.current;
    if (!v) return undefined;
    v.muted = muted;
    if (isActive) {
      v.play().catch(function () {});
      setIsPlaying(true);
    } else {
      try { v.pause(); } catch (e) {}
      setIsPlaying(false);
    }
  }, [isActive, muted]);

  React.useEffect(function () {
    var v = videoRef.current;
    if (!v) return undefined;
    var update = function () {
      if (v.duration) setProgress((v.currentTime / v.duration) * 100);
    };
    v.addEventListener('timeupdate', update);

const SnapPlayer = ({ snaps, startIndex = 0, onClose, username, onLike }) => {
  const [currentIndex, setCurrentIndex] = React.useState(startIndex);
  const containerRef = React.useRef(null);
  const isSwiping = React.useRef(false);
  const dragOffset = React.useRef(0);
  const touchStartRef = React.useRef({ y: 0, time: 0 });

  React.useEffect(function () {
    // keyboard nav
    function handleKey(e) {
      if (e.key === "ArrowDown" && currentIndex < snaps.length - 1) setCurrentIndex(function (i) { return i + 1; });
      else if (e.key === "ArrowUp" && currentIndex > 0) setCurrentIndex(function (i) { return i - 1; });
      else if (e.key === "Escape") onClose();
    }
    window.addEventListener('keydown', handleKey);
    return function () { window.removeEventListener('keydown', handleKey); };
  }, [currentIndex, snaps.length, onClose]);

  // preload next two video urls with <link rel="preload">
  React.useEffect(function () {
    var links = [];
    for (var i = 1; i <= 2; i++) {
      var s = snaps[currentIndex + i];
      if (s && s.media && s.media[0]) {
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'video';
        l.href = s.media[0];
        l.crossOrigin = 'anonymous';
        document.head.appendChild(l);
        links.push(l);
      }
    }
    return function () {
      links.forEach(function (l) { try { document.head.removeChild(l); } catch (e) {} });
    };
  }, [currentIndex, snaps]);

  // touch handlers (vertical swipe)
  function handleTouchStart(e) {
    if (!e || !e.touches) return;
    touchStartRef.current = { y: e.touches[0].clientY, time: Date.now() };
    isSwiping.current = true;
  }
  function handleTouchMove(e) {
    if (!isSwiping.current || !e || !e.touches) return;
    var dy = e.touches[0].clientY - touchStartRef.current.y;
    dragOffset.current = dy;
    // apply transform directly for smoothness
    if (containerRef.current) containerRef.current.style.transform = "translateY(" + ((-currentIndex * 100) + (dy / window.innerHeight * 100)) + "vh)";
  }
  function handleTouchEnd() {
    isSwiping.current = false;
    var dy = dragOffset.current;
    var elapsed = Date.now() - touchStartRef.current.time;
    var velocity = Math.abs(dy) / (elapsed || 1);
    var threshold = 80;
    var newIndex = currentIndex;
    if (Math.abs(dy) > threshold || velocity > 0.3) {
      if (dy > 0 && currentIndex > 0) newIndex = currentIndex - 1;
      else if (dy < 0 && currentIndex < snaps.length - 1) newIndex = currentIndex + 1;
    }
    setCurrentIndex(newIndex);
    dragOffset.current = 0;
    if (containerRef.current) containerRef.current.style.transform = "translateY(" + (-newIndex * 100) + "vh)";
  }

  // prevent body scroll while player open
  React.useEffect(function () {
    document.body.style.overflow = 'hidden';
    return function () { document.body.style.overflow = ''; };
  }, []);

  return (
    <div className="fixed inset-0 z-50 bg-black" role="dialog" aria-modal="true">
      <button onClick={onClose} className="absolute top-4 right-4 z-50 p-2 rounded-full bg-black/40 text-white">✕</button>
      <div ref={containerRef} className="h-full w-full transition-transform duration-300 ease-out" style={{ transform: "translateY(" + (-currentIndex * 100) + "vh)" }} onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd}>
        {snaps.map(function (snap, idx) {
          return (
            <div key={snap.id} className="h-screen w-full flex items-center justify-center">
              <div className="w-full h-full max-w-[480px] mx-auto relative">
                <PlayerSingle snap={snap} username={username} isActive={idx === currentIndex} onLike={onLike} />
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

  const [error, setError] = React.useState('');
  const [activeTab, setActiveTab] = React.useState('users'); // 'users' or 'posts'
  const currentUsername = localStorage.currentUser || '';

  async function runSearch() {
    if (!searchQuery.trim()) return;
    setLoading(true);
    setError('');
    try {
      const res = await fetch(
        `/general/search?query=${encodeURIComponent(searchQuery)}&currentUsername=${encodeURIComponent(currentUsername)}`
      );
      if (!res.ok) throw new Error('Failed to fetch search results');
      const data = await res.json();
      setResults(data);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  }

  function handleKeyDown(e) {
    if (e.key === 'Enter') runSearch();
  }

  const handleRelationChange = async (username, action, profileType) => {
    try {
      const endpoint = profileType === 'organisation' ? '/follow' : '/friend';
      await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, currentUsername, action }),
      });
      setResults(prev =>
        prev.map(r =>
          r.type === 'user' && r.username === username
            ? {
                ...r,
                relation:
                  profileType === 'organisation'
                    ? action === 'follow' ? 'following' : 'not_following'
                    : action === 'friend' ? 'friended' : 'not_friended',
              }
            : r
        )
      );
    } catch (err) {
      console.error('Relation change failed', err);
    }
  };

  const userResults = results.filter(r => r.type === 'user');
  const postResults = results.filter(r => r.type === 'post');

  return (
    <div className="font-sans antialiased min-h-screen p-4 bg-[#f9fafe]">
      {/* Search bar */}
      <div className="flex items-center gap-2 max-w-xl mx-auto mb-6">
        <input
          type="text"
          value={searchQuery}
          onChange={e => setSearchQuery(e.target.value)}
          onKeyDown={handleKeyDown}
          placeholder="Search users or posts..."
          className="flex-grow px-5 py-3 rounded-full bg-white shadow-sm border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
        />
        <button
          onClick={runSearch}
          className="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-full shadow transition"
          aria-label="Search"
        >
          <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 103 10.5a7.5 7.5 0 0013.15 6.15z" />
          </svg>
        </button>
      </div>

      {/* Tabs */}
      <div className="flex justify-center mb-6 space-x-2">
        <button
          onClick={() => setActiveTab('users')}
          className={`px-4 py-2 text-sm rounded-full transition ${
            activeTab === 'users'
              ? 'bg-blue-600 text-white shadow'
              : 'bg-white text-gray-600 border border-gray-300'
          }`}
        >
          Users
        </button>
        <button
          onClick={() => setActiveTab('posts')}
          className={`px-4 py-2 text-sm rounded-full transition ${
            activeTab === 'posts'
              ? 'bg-blue-600 text-white shadow'
              : 'bg-white text-gray-600 border border-gray-300'
          }`}
        >
          Posts
        </button>
      </div>

      {/* Loading */}
      {loading && (
        <div className="flex justify-center items-center h-48">
          <svg className="animate-spin w-8 h-8 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.372 0 0 5.372 0 12h4z" />
          </svg>
        </div>
      )}

      {/* Error */}
      {error && <div className="text-red-500 text-center mb-4">{error}</div>}

      {/* No Results */}
      {!loading && !error && searchQuery && results.length === 0 && (
        <div className="text-center text-gray-500">No results found for "{searchQuery}"</div>
      )}

      {/* Users Tab */}
      {!loading && activeTab === 'users' && userResults.length > 0 && (
        <div className="flex flex-col gap-4 max-w-2xl mx-auto">
          {userResults.map(user => (
            <div
              key={user.username}
              className="bg-white rounded-xl shadow-sm p-4 flex justify-between items-center hover:shadow-md transition"
            >
              <div
                className="flex items-center gap-3 cursor-pointer"
                onClick={() => Lexum.navigate(`/@${user.username}`)}
              >
                <img
                  src={user.profile_pic}
                  className="w-12 h-12 rounded-full object-cover"
                  alt={user.username}
                />
                <div className="text-sm">
                  <div className="font-semibold text-gray-900 hover:underline">{user.fullname}</div>
                  <div className="text-gray-500">@{user.username}</div>
                  <div className="text-xs text-gray-400">{user.profile_type}</div>
                </div>
              </div>
              <button
                onClick={() =>
                  handleRelationChange(
                    user.username,
                    user.profile_type === 'organisation' ? (user.relation === 'following' ? 'unfollow' : 'follow') : (user.relation === 'friended' ? 'unfriend' : 'friend'),
                    user.profile_type
                  )
                }
                className={`px-4 py-2 text-sm rounded-full transition ${
                  user.relation === 'friended' || user.relation === 'following'
                    ? 'bg-gray-200 text-gray-800 hover:bg-gray-300'
                    : 'bg-blue-600 text-white hover:bg-blue-700'
                }`}
              >
                {user.profile_type === 'organisation'
                  ? user.relation === 'following' ? 'Unfollow' : 'Follow'
                  : user.relation === 'friended' ? 'Unfriend' : 'Add Friend'}
              </button>
            </div>
          ))}
        </div>
      )}

      {/* Posts Tab */}
      {!loading && activeTab === 'posts' && postResults.length > 0 && (
        <div className="max-w-2xl mx-auto">
          <Feed propPosts={postResults} />
        </div>
      )}
    </div>
  );
}

/* GameModal: awards 12 Mobcoins per validated minute of interaction.
   Endpoint: POST /t/claim-game-reward with body { userId, gameId, coins }.
   NOTE: per your instruction, gameId is 'breakout' for rewards.
*/
function GameModal({ game, open, onClose, onClaimSuccess }) {
  const REWARD_PER_MINUTE = 12;
  const MIN_INTERACTIONS_PER_MINUTE = 3; // minimum interactions required per minute
  const CLAIM_ENDPOINT = "/t/claim-game-reward";
  const GAME_ID_FOR_REWARD = "breakout"; // per your request

  const userId = localStorage.currentUser || null; // your spec said use localstorage.currentUser

  const [loading, setLoading] = React.useState(true);
  const [activeSeconds, setActiveSeconds] = React.useState(0);
  const [interactionsThisMinute, setInteractionsThisMinute] = React.useState(0);
  const [awardedMinutes, setAwardedMinutes] = React.useState(0);
  const [coinsAwarded, setCoinsAwarded] = React.useState(0);
  const [secondsUntilNextAward, setSecondsUntilNextAward] = React.useState(60);
  const sessionRef = React.useRef({
    startedAt: 0,
    intervalId: null,
    minuteClock: 0, // seconds into the current minute
    interactionsTimestamps: [], // timestamps in ms of recent interactions
    closed: false,
  });

  React.useEffect(() => {
    if (!open) return;

    // init
    sessionRef.current.startedAt = Date.now();
    sessionRef.current.minuteClock = 0;
    sessionRef.current.interactionsTimestamps = [];
    sessionRef.current.closed = false;
    setActiveSeconds(0);
    setInteractionsThisMinute(0);
    setAwardedMinutes(0);
    setCoinsAwarded(0);
    setSecondsUntilNextAward(60);
    setLoading(true);

    // tick every second
    function tick() {
      // count active second only if page has focus
      if (document.hasFocus()) {
        setActiveSeconds(s => s + 1);
        sessionRef.current.minuteClock += 1;
      }

      // cleanup old interaction timestamps (> 60s)
      const now = Date.now();
      sessionRef.current.interactionsTimestamps = sessionRef.current.interactionsTimestamps.filter(ts => now - ts <= 60_000);
      setInteractionsThisMinute(sessionRef.current.interactionsTimestamps.length);

      // update secondsUntilNextAward
      const secLeft = 60 - sessionRef.current.minuteClock;
      setSecondsUntilNextAward(secLeft > 0 ? secLeft : 0);

      // if one full minute passed, evaluate awarding
      if (sessionRef.current.minuteClock >= 60) {
        const interactions = sessionRef.current.interactionsTimestamps.length;
        sessionRef.current.minuteClock = 0;
        // reset interaction list (start new minute)
        sessionRef.current.interactionsTimestamps = [];

        if (interactions >= MIN_INTERACTIONS_PER_MINUTE) {
          // award this minute
          awardMinutes(1);
        } else {
          // no award for this minute - do nothing (anti-spam)
          console.debug("minute skipped, interactions:", interactions);
        }
        setSecondsUntilNextAward(60);
      }
    }

    sessionRef.current.intervalId = setInterval(tick, 1000);

    // interaction handlers (we cannot listen inside iframe, so capture pointerdown/keydown on window)
    function onPointerDown(e) {
      // record timestamp
      sessionRef.current.interactionsTimestamps.push(Date.now());
      setInteractionsThisMinute(sessionRef.current.interactionsTimestamps.length);
    }
    function onKeyDown(e) {
      // small energy: count any key press as interaction
      sessionRef.current.interactionsTimestamps.push(Date.now());
      setInteractionsThisMinute(sessionRef.current.interactionsTimestamps.length);
    }

    window.addEventListener("pointerdown", onPointerDown, { passive: true });
    window.addEventListener("keydown", onKeyDown, { passive: true });

    return () => {
      // cleanup
      clearInterval(sessionRef.current.intervalId);
      window.removeEventListener("pointerdown", onPointerDown);
      window.removeEventListener("keydown", onKeyDown);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [open, game]);

  // award function: calls server endpoint with coins = minutes * REWARD_PER_MINUTE
  async function awardMinutes(minutesCount) {
    if (sessionRef.current.closed) return;
    if (!userId) {
      console.error("No userId in localStorage.currentUser");
      return;
    }
    const coins = minutesCount * REWARD_PER_MINUTE;
    try {
      const res = await fetch(CLAIM_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId, gameId: GAME_ID_FOR_REWARD, coins }),
      });
      const js = await res.json();
      if (res.ok) {
        // update local counters
        setAwardedMinutes(m => m + minutesCount);
        setCoinsAwarded(c => c + coins);
        // if backend returns new balance, bubble up
        if (js && js.newBalance != null) {
          if (typeof onClaimSuccess === "function") onClaimSuccess(js.newBalance);
        }
      } else {
        console.error("Claim endpoint error", js);
      }
    } catch (err) {
      console.error("Failed to call claim endpoint", err);
    }
  }

  // finalize: calculate any remaining FULL minutes that were not awarded yet, award them if valid
  async function finalizeAndClose() {
    if (sessionRef.current.closed) return;
    sessionRef.current.closed = true;

    // compute total full minutes played
    const totalFullMinutes = Math.floor(activeSeconds / 60);
    const remaining = totalFullMinutes - awardedMinutes;
    if (remaining > 0) {
      // For safety we only award remaining full minutes if interactions existed for those minutes.
      // Because we track interactions minute-by-minute and only award when a minute passed,
      // remaining should normally be 0. But as final safety, we'll award remaining if interactions count overall >= MIN_INTERACTIONS_PER_MINUTE per minute average:
      // simple heuristic: if total interactions >= remaining * MIN_INTERACTIONS_PER_MINUTE then award.
      // Compute interactions total (best-effort = interactionsThisMinute + awardedMinutes * MIN_INTERACTIONS_PER_MINUTE)
      const interactionsApprox = interactionsThisMinute + (awardedMinutes * MIN_INTERACTIONS_PER_MINUTE);
      if (interactionsApprox >= remaining * MIN_INTERACTIONS_PER_MINUTE) {
        await awardMinutes(remaining);
      } else {
        console.debug("finalize: not enough interaction evidence to award remaining minutes", { remaining, interactionsApprox });
      }

// keep your existing helpers (unchanged logic)
async function applyRemoteDescriptionWhenReady(pc, desc) {
  if (!pc) return;
  try {
    if (pc.signalingState === "have-local-offer" || pc.signalingState === "have-local-pranswer") {
      await pc.setRemoteDescription(desc);
      return;
    }
    // Wait briefly for state change, then apply
    await new Promise((resolve, reject) => {
      let settled = false;
      const onChange = async () => {
        try {
          if (["have-local-offer", "have-local-pranswer"].includes(pc.signalingState)) {
            pc.removeEventListener("signalingstatechange", onChange);
            settled = true;
            await pc.setRemoteDescription(desc);
            resolve();
          }
        } catch (err) {
          pc.removeEventListener("signalingstatechange", onChange);
          settled = true;
          reject(err);
        }
      };
      pc.addEventListener("signalingstatechange", onChange);
      setTimeout(() => {
        if (!settled) {
          pc.removeEventListener("signalingstatechange", onChange);
          // fallback: try direct setRemoteDescription (caller will catch)
          reject(new Error("Timed out waiting for signalingState change"));
        }
      }, 4500);
    });
  } catch (err) {
    // fallback: try once directly
    try {
      await pc.setRemoteDescription(desc);
    } catch (e) {
      console.error("applyRemoteDescriptionWhenReady final failure", e);
      throw e;
    }
  }
}

function ensureNoStalePc(pcMap, key) {
  const old = pcMap.get(key);
  if (old) {
    try { old.close(); } catch (e) {}
    pcMap.delete(key);
  }
}

  // responsive layout flag - render only one layout (and therefore one video element)
  const [isDesktop, setIsDesktop] = React.useState(() => {
    try {
      if (typeof window !== "undefined" && window.matchMedia) {
        return window.matchMedia("(min-width: 768px)").matches;
      }
    } catch (e) {}
    return false;
  });

  React.useEffect(() => {
    if (typeof window === "undefined" || !window.matchMedia) return;
    const mql = window.matchMedia("(min-width: 768px)");
    function handler(e) {
      setIsDesktop(Boolean(e && e.matches));
    }
    try {
      // use addEventListener where supported
      if (typeof mql.addEventListener === "function") {
        mql.addEventListener("change", handler);
      } else if (typeof mql.addListener === "function") {
        mql.addListener(handler);
      }
    } catch (e) {}
    // initial set (in case)
    setIsDesktop(Boolean(mql.matches));
    return () => {
      try {
        if (typeof mql.removeEventListener === "function") {
          mql.removeEventListener("change", handler);
        } else if (typeof mql.removeListener === "function") {
          mql.removeListener(handler);
        }
      } catch (e) {}
    };
  }, []);

  // Run inside Live component: emit periodic pulse while live
  React.useEffect(() => {
    if (!isLive || !postId) return;
    const id = setInterval(() => {
      try {
        socket.emit("livePulse", { postId: postId });
      } catch (e) { console.warn("livePulse emit failed", e); }
    }, 8000); // every 8s (less than server TTL)

    return function cleanup() {
      clearInterval(id);
    };
  }, [isLive, postId]);

  // --- SOCKET SETUP ---
  React.useEffect(function setupSocket() {
    function onViewerCountUpdate(payload) {
      if (payload && String(payload.postId) === String(postId)) {
        setViewerCount(Number(payload.count || 0));
      }
    }

    async function onViewerWantsOffer(payload) {
      if (!payload || String(payload.postId) !== String(postId)) return;
      var viewerSocketId = payload.viewerSocketId;
      ensureNoStalePc(pcMapRef.current, viewerSocketId);

      var pc = createPeerConnectionForViewer(viewerSocketId);
      var localStream = localStreamRef.current;
      if (localStream) {
        try {
          localStream.getTracks().forEach(function (t) { pc.addTrack(t, localStream); });
        } catch (e) {
          console.warn("addTrack failed", e);
        }
      }

      try {
        var offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit("host-offer", { to: viewerSocketId, sdp: pc.localDescription, postId: postId });
      } catch (err) {
        console.error("onViewerWantsOffer offer creation failed", err);
      }
    }

    async function onViewerAnswer(payload) {
      if (!payload || !payload.from || !payload.sdp) return;
      var pc = pcMapRef.current.get(payload.from);
      if (pc) {
        try {
          const desc = new RTCSessionDescription(payload.sdp);
          await applyRemoteDescriptionWhenReady(pc, desc);
        } catch (err) {
          console.error("onViewerAnswer failed to apply remote description", err);
        }
      } else {
        console.warn("Received viewer-answer for missing pc:", payload.from);
      }
    }

    async function onIceCandidateLive(payload) {
      if (!payload || !payload.from || !payload.candidate) return;
      var pc = pcMapRef.current.get(payload.from);
      if (pc) {
        try { await pc.addIceCandidate(new RTCIceCandidate(payload.candidate)); }
        catch (e) { console.warn("host addIceCandidate failed", e); }
      }
    }

    function onLiveComment(payload) {
      if (payload && String(payload.postId) === String(postId) && payload.comment) {
        setHostComments(function (prev) { return prev.concat([payload.comment]); });
      }
    }

  function createPeerConnectionForViewer(viewerSocketId) {
    var pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
    pc.onicecandidate = function (ev) { if (ev && ev.candidate) socket.emit("ice-candidate-live", { to: viewerSocketId, from: socket.id, candidate: ev.candidate }); };
    pc.onconnectionstatechange = function () {
      if (pc && (pc.connectionState === "failed" || pc.connectionState === "closed" || pc.connectionState === "disconnected")) {
        try { pc.close(); } catch (e) {}
        pcMapRef.current.delete(viewerSocketId);
      }
    };

    // fallback negotiationneeded handler
    pc.onnegotiationneeded = async function () {
      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit("host-offer", { to: viewerSocketId, sdp: pc.localDescription, postId: postId });
      } catch (err) {
        console.error("pc.onnegotiationneeded error", err);
      }
    };

    pcMapRef.current.set(viewerSocketId, pc);
    return pc;
