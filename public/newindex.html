  // --- Recording helpers ---
  function startLocalRecordingTimer() {
    recordingStartRef.current = Date.now();
    recordingTimerRef.current = setInterval(function () {
      setRecordingTimeSec(Math.floor((Date.now() - recordingStartRef.current) / 1000));
    }, 500);
  }
  function stopLocalRecordingTimer() {
    if (recordingTimerRef.current) {
      clearInterval(recordingTimerRef.current);
      recordingTimerRef.current = null;
    }
    recordingStartRef.current = 0;
  }

  function startRecording(stream) {
    recordedChunksRef.current = [];
    setRecordedChunksCount(0);
    setRecordingTimeSec(0);

    var mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
      ? "video/webm;codecs=vp9"
      : "video/webm";

    try {
      var recorder = new MediaRecorder(stream, { mimeType: mimeType });
      mediaRecorderRef.current = recorder;

      recorder.ondataavailable = function (e) {
        if (e && e.data && e.data.size > 0) {
          recordedChunksRef.current.push(e.data);
          setRecordedChunksCount(recordedChunksRef.current.length);
        }
      };

      recorder.onstart = function () {
        setRecorderState("recording");
        startLocalRecordingTimer();
        console.log("Recording started (state = recording)");
      };
      recorder.onpause = function () {
        setRecorderState("paused");
        console.log("Recording paused");
      };
      recorder.onresume = function () {
        setRecorderState("recording");
        console.log("Recording resumed");
      };
      recorder.onstop = function () {
        setRecorderState("inactive");
        stopLocalRecordingTimer();
        console.log("Recording stopped; chunks:", recordedChunksRef.current.length);
      };

      // timeslice 1000ms so ondataavailable fires frequently and you can inspect progress
      recorder.start(1000);
      console.log("Recorder.start called with timeslice=1000ms");
    } catch (err) {
      console.error("startRecording failed:", err);
      setRecorderState("inactive");
    }
  }

  async function stopRecordingAndUpload(postIdArg) {
    return new Promise(function (resolve) {
      var recorder = mediaRecorderRef.current;
      if (!recorder) {
        console.log("stopRecordingAndUpload: no recorder present");
        return resolve(null);
      }

      recorder.onstop = async function () {
        setRecorderState("inactive");
        stopLocalRecordingTimer();
        var blob = new Blob(recordedChunksRef.current, { type: "video/webm" });
        console.log("Final recording blob size:", blob.size, "bytes; chunks:", recordedChunksRef.current.length);

        if (!blob || blob.size === 0) {
          console.warn("Recorded blob empty");
          return resolve(null);
        }

        // New: Use XMLHttpRequest for progress tracking
        var formData = new FormData();
        formData.append("video", blob, postIdArg + ".webm");
        formData.append("postId", postIdArg);

        try {
          var xhr = new XMLHttpRequest();
          xhr.open("POST", "/upload-live", true);

          xhr.upload.onprogress = function (e) {
            if (e.lengthComputable) {
              var percent = Math.round((e.loaded / e.total) * 100);
              setUploadProgress(percent);
              console.log("Upload progress:", percent + "%");
            }
          };

          xhr.onload = function () {
            if (xhr.status === 200) {
              try {
                var json = JSON.parse(xhr.responseText);
                console.log("Upload result:", json);
                resolve(json && json.savedUrl ? json.savedUrl : null);
              } catch (err) {
                console.error("Parse upload response failed:", err);
                resolve(null);
              }
            } else {
              console.error("Upload failed with status:", xhr.status);
              resolve(null);
            }
          };

          xhr.onerror = function () {
            console.error("Upload error");
            resolve(null);
          };

          xhr.send(formData);
        } catch (err) {
          console.error("Upload failed:", err);
          resolve(null);
        }
      };

      try {
        if (recorder.state !== "inactive") {
          recorder.stop();
          console.log("recorder.stop() called");
        } else {
          console.log("recorder already inactive");
          resolve(null);
        }
      } catch (e) {
        console.warn("recorder.stop() failed", e);
        resolve(null);
      }
    });
  }

  // --- Pause/Resume Live ---
  function pauseLive() {
    if (!isLive || !localStreamRef.current) return;
    try { localStreamRef.current.getTracks().forEach(function (track) { track.enabled = false; }); } catch (e) {}
    if (mediaRecorderRef.current && mediaRecorderRef.current.state === "recording") {
      try { mediaRecorderRef.current.pause(); } catch (e) { console.warn("pause failed", e); }
    }
    setIsPaused(true);
    socket.emit("livePaused", { postId: postId });
  }

  function resumeLive() {
    if (!isLive || !localStreamRef.current) return;
    try { localStreamRef.current.getTracks().forEach(function (track) { track.enabled = true; }); } catch (e) {}
    if (mediaRecorderRef.current && mediaRecorderRef.current.state === "paused") {
      try { mediaRecorderRef.current.resume(); } catch (e) { console.warn("resume failed", e); }
    }
    setIsPaused(false);
    socket.emit("liveResumed", { postId: postId });
  }

  // --- START LOCAL MEDIA ---
  async function startLocalMedia() {
    setError("");
    var stream;
    try {
      if (mode === "camera") {
        // mobile: request facingMode; desktop: let browser choose available camera
        var isMobileUserAgent = false;
        try {
          if (typeof navigator !== "undefined" && navigator.userAgent) {
            isMobileUserAgent = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
          }
        } catch (e) {}
        var videoConstraints = isMobileUserAgent ? { facingMode: facingMode } : true;
        stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: videoConstraints });
      } else {
        stream = await navigator.mediaDevices.getDisplayMedia({ audio: true, video: true });
      }
    } catch (err) {
      console.error("getUserMedia/getDisplayMedia failed", err);
      setError("Unable to access camera/screen. Check permissions or try a different browser.");
      throw err;
    }

    localStreamRef.current = stream;
    if (localVideoRef.current) {
      try { localVideoRef.current.muted = true; } catch (e) {}
      try {
        localVideoRef.current.srcObject = stream;
      } catch (e) {
        console.warn("assign srcObject failed", e);
      }
      try {
        // wait for metadata then play
        var playPromise = new Promise(function (resolve) {
          function onLoaded() {
            if (!localVideoRef.current) return resolve();
            localVideoRef.current.removeEventListener("loadedmetadata", onLoaded);
            resolve();
          }
          if (localVideoRef.current) {
            localVideoRef.current.addEventListener("loadedmetadata", onLoaded);
            if (localVideoRef.current.readyState >= 1) {
              localVideoRef.current.removeEventListener("loadedmetadata", onLoaded);
              resolve();
            }
          } else {
            resolve();
          }
        });
        await playPromise;
        if (localVideoRef.current) {
          await localVideoRef.current.play().catch(function (e) { console.warn("local preview play() blocked or failed:", e); });
        }
      } catch (e) {
        console.warn("video attach/play handling failed", e);
      }
    }

    // diagnostics
    try {
      console.log("startLocalMedia: stream tracks", stream.getTracks().map(function (t) { return { id: t.id, kind: t.kind, enabled: t.enabled, readyState: t.readyState }; }));
      console.log("videoTracks:", stream.getVideoTracks());
    } catch (e) {}

    startRecording(stream);
    return stream;
  }

    if (!text || !text.trim()) { setError("Add a title for the live."); return; }

      try {

        setIsLive(true);

        setError("Could not start media: " + (e && e.message ? e.message : e));
        try { socket.emit("endLive", { postId: res.postId, save: true }, function (ack) { console.log("Error endLive ack =>", ack); }); } catch (ex) {}
      }
      setLoadingStart(false);

  async function handleEndLive() {
    if (!postId) return;
    setLoadingEnd(true);
    setIsUploading(true);
    setUploadProgress(0); // Reset progress

    try { if (localStreamRef.current) localStreamRef.current.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    localStreamRef.current = null;
    if (localVideoRef.current) localVideoRef.current.srcObject = null;

    pcMapRef.current.forEach(function (pc) { try { pc.close(); } catch (e) {} });
    pcMapRef.current.clear();

    // stop recorder and upload
    let savedUrl = await stopRecordingAndUpload(postId);

    socket.emit("endLive", { postId: postId, save: true, savedUrl: savedUrl }, function (ack) {

      setIsLive(false);

      setUploadProgress(0);

      try { Lexum.navigate('/'); } catch (e) {}

  }

                        <span className="text-xs text-gray-400">{timeAgo(c.created_at || Date.now())}</span>

                    </div>
                  );
                })
              )}
            </div>
            <div className="flex gap-2">
              <input
                value={commentText}
                onChange={function (e) { setCommentText(e.target.value); }}
                placeholder="Write a comment..."
                className="flex-1 border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
              <button
                onClick={sendHostComment}
                className="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium"
              >
                Send
              </button>
            </div>
          </div>
        </div>
      )}

      {/* New: Full-screen upload warning overlay */}
      {isUploading && (
        <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
          <div className="text-center text-white p-8 rounded-lg">
            <h2 className="text-3xl font-bold mb-4">Uploading Recording...</h2>
            <p className="text-lg mb-6">
              Please stay on this page until the upload finishes to avoid losing your video. This may take a few minutes for long sessions.
            </p>
            {/* Mock/Real Loading Circle with Progress */}
            <div className="relative w-32 h-32 mx-auto mb-4">
              <svg className="w-full h-full" viewBox="0 0 100 100">
                <circle
                  className="stroke-current text-gray-500"
                  strokeWidth="10"
                  cx="50"
                  cy="50"
                  r="40"
                  fill="transparent"
                ></circle>
                <circle
                  className="stroke-current text-blue-500"
                  strokeWidth="10"
                  cx="50"
                  cy="50"
                  r="40"
                  fill="transparent"
                  strokeDasharray="251.2"
                  strokeDashoffset={251.2 * (1 - uploadProgress / 100)}
                  transform="rotate(-90 50 50)"
                ></circle>
              </svg>
              <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-2xl font-bold">
                {uploadProgress}%
              </div>
            </div>
            <p className="text-sm text-gray-300">Do not close or refresh the page.</p>
          </div>
        </div>
      )}
    </div>
  );
}
/* -------------------------------------------------------------------------
   WatchLive (viewer)
   - kept your UI/markup exactly; improved ontrack/offer handling
   ------------------------------------------------------------------------- */
   function WatchLive() {
  const pathParts = window.location.pathname.split("/");
  const postId = window.location.pathname.split("/live/")[1] || "";

  const [isJoined, setIsJoined] = React.useState(false);
  const [viewerCount, setViewerCount] = React.useState(0);
  const [comments, setComments] = React.useState([]);
  const [commentText, setCommentText] = React.useState("");
  const [error, setError] = React.useState("");
  const [giftAmount, setGiftAmount] = React.useState(50);
  const [giftProcessing, setGiftProcessing] = React.useState(false);

  const [isMuted, setIsMuted] = React.useState(true);
  const [isMobile, setIsMobile] = React.useState(false);

  const videoRef = React.useRef(null);
  const pcRef = React.useRef(null);
  const commentsEndRef = React.useRef(null);
  const autoJoinedRef = React.useRef(false);

  // detect mobile / touch device and update on resize
  React.useEffect(() => {
    function detect() {
      const mobile =
        typeof window !== "undefined" &&
        (("ontouchstart" in window) ||
          (navigator.maxTouchPoints && navigator.maxTouchPoints > 0) ||
          window.innerWidth <= 768);
      setIsMobile(Boolean(mobile));
    }
    detect();
    window.addEventListener("resize", detect);
    return () => window.removeEventListener("resize", detect);
  }, []);

  // auto-scroll comments
  React.useEffect(() => {
    if (commentsEndRef.current) {
      commentsEndRef.current.scrollIntoView({ behavior: "smooth" });
    }
  }, [comments]);

  React.useEffect(() => {
    function onViewerCountUpdate(payload) {
      if (payload?.postId?.toString() === postId.toString()) {
        setViewerCount(Number(payload.count || 0));
      }
    }

    function onLiveEnded(payload) {
      // ONLY react if this ended live matches our postId
      if (payload?.postId?.toString() === postId.toString()) {
        cleanup();
        try { exitFullscreen(); } catch {}
        alert("Live stream ended");
        Lexum.navigate("/post/" + postId);
      }
      // otherwise ignore
    }

    async function onHostOffer(payload) {
      if (payload?.postId?.toString() !== postId.toString()) return;
      try {
        const from = payload.from;
        const sdp = payload.sdp;

        // clean any existing pc
        if (pcRef.current) {
          try {
            pcRef.current.close();
          } catch {}
          pcRef.current = null;
        }

        const pc = new RTCPeerConnection({
          iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
        });
        pcRef.current = pc;

        pc.ontrack = (ev) => {
          try {
            // prefer provided stream
            if (ev.streams && ev.streams[0]) {
              if (videoRef.current) {
                videoRef.current.srcObject = ev.streams[0];
                // important: keep video muted initially to allow autoplay
                try {
                  videoRef.current.muted = isMuted;
                } catch {}
                videoRef.current.play().catch(() => {});
              }
              // If on mobile and user wants fullscreen, attempt to enter
              if (isMobile) {
                enterFullscreen().catch(() => {});
              }
              return;
            }
            // otherwise append tracks into a MediaStream
            let remoteStream = videoRef.current?.srcObject;
            if (!remoteStream) {
              remoteStream = new MediaStream();
              if (videoRef.current) videoRef.current.srcObject = remoteStream;
            }
            if (ev.track) remoteStream.addTrack(ev.track);
            try {
              videoRef.current.muted = isMuted;
            } catch {}
            videoRef.current.play().catch(() => {});
          } catch (e) {
            console.warn("ontrack handler failed", e);
          }
        };

        pc.onicecandidate = (ev) => {
          if (ev.candidate) {
            socket.emit("ice-candidate-live", {
              to: from,
              from: socket.id,
              candidate: ev.candidate,
            });
          }
        };

        // apply remote offer then answer
        const remoteDesc =
          sdp && sdp.type ? new RTCSessionDescription(sdp) : new RTCSessionDescription(sdp);
        await pc.setRemoteDescription(remoteDesc);
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        socket.emit("viewer-answer", {
          to: from,
          from: socket.id,
          sdp: pc.localDescription,
        });
        setIsJoined(true);
      } catch (err) {
        console.error("onHostOffer error", err);
      }
    }

    function onIceCandidateLive(payload) {
      if (!payload?.candidate || !pcRef.current) return;
      pcRef.current
        .addIceCandidate(new RTCIceCandidate(payload.candidate))
        .catch((err) => {
          console.warn("addIceCandidate viewer failed", err);
        });
    }

    function onLiveComment(payload) {
      if (payload?.postId?.toString() === postId.toString() && payload.comment) {
        setComments((prev) => [...prev, payload.comment]);
      }
    }

    function onMobcoinsGift(payload) {
      if (!payload) return;
      const g = {
        username: payload.fromId || "Someone",
        text: `🎁 gifted ${payload.amount} Mobcoins`,
        created_at: new Date().toISOString(),
        special: true,
      };
      setComments((prev) => [...prev, g]);
    }

    function onGlobalLiveStarted(payload) {
      if (payload?.postId?.toString() === postId.toString()) {
        console.log("Notified that this post started live:", payload.postId);
      }
    }

    socket.on("viewerCountUpdate", onViewerCountUpdate);
    socket.on("liveEnded", onLiveEnded);
    socket.on("host-offer", onHostOffer);
    socket.on("ice-candidate-live", onIceCandidateLive);
    socket.on("liveComment", onLiveComment);
    socket.on("mobcoins-gift", onMobcoinsGift);
    socket.on("liveStarted", onGlobalLiveStarted);

    return () => {
      socket.off("viewerCountUpdate", onViewerCountUpdate);
      socket.off("liveEnded", onLiveEnded);
      socket.off("host-offer", onHostOffer);
      socket.off("ice-candidate-live", onIceCandidateLive);
      socket.off("liveComment", onLiveComment);
      socket.off("mobcoins-gift", onMobcoinsGift);
      socket.off("liveStarted", onGlobalLiveStarted);
    };
  }, [postId, isMuted, isMobile]);

  // Ask server if live is running now and get viewer count
  React.useEffect(() => {
    if (!postId) return;
    socket.emit("getLiveUrl", postId, (ack) => {
      if (!ack || !ack.ok) return;
      if (typeof ack.count !== "undefined") setViewerCount(Number(ack.count || 0));
      // ack.url indicates a room if live is active; don't auto-join by default
    });
  }, [postId]);

  // Auto-join on mobile / small screens once (to follow your request)
  React.useEffect(() => {
    if (!postId) return;
    if (isMobile && !autoJoinedRef.current) {
      autoJoinedRef.current = true;
      // small delay to let socket connections stabilize
      setTimeout(() => {
        joinLive();
      }, 250);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [isMobile, postId]);

  function cleanup() {
    setIsJoined(false);
    try {
      pcRef.current?.close();
      pcRef.current = null;
    } catch {}
    try {
      if (videoRef.current) videoRef.current.srcObject = null;
    } catch {}
  }

  function joinLive() {
    setError("");
    console.log("Joining live with postId:", postId);
    socket.emit("joinLive", { postId }, (ack) => {
      if (!ack?.ok) {
        setError(ack?.error || "Failed to join");
      } else {
        if (typeof ack.count !== "undefined") setViewerCount(Number(ack.count || 0));
        // If on mobile, request fullscreen so the viewer gets immersive experience
        if (isMobile) {
          // try to open fullscreen after a short delay (offer will attach stream soon)
          setTimeout(() => {
            enterFullscreen().catch(() => {});
          }, 300);
        }
      }
    });
  }

  function leaveLive() {
    socket.emit("leaveLive", { postId }, () => {});
    cleanup();
    exitFullscreen().catch(() => {});
  }

  function sendComment() {
    const t = commentText.trim();
    if (!t) return;
    const comment = {
      username: localStorage.currentUser || "Guest",
      text: t,
      created_at: new Date().toISOString(),
    };
    setCommentText("");
    // optimistic UI
    setComments((prev) => [...prev, comment]);
    socket.emit("liveComment", { postId, comment }, () => {});
  }

  async function sendGift() {
    if (!postId) return;
    setGiftProcessing(true);
    try {
      const toUsername =
        localStorage.getItem("liveSt") || prompt("Enter streamer username to gift:");
      if (!toUsername) {
        setGiftProcessing(false);
        return;
      }

      const body = {
        fromId: localStorage.currentUser || "Guest",
        toIds: [toUsername],
        amount: Number(giftAmount),
      };
      const res = await fetch("/t/send-mobcoins", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const json = await res.json();
      if (!res.ok) {
        alert(json.error || "Gift failed");
      } else {
        setComments((prev) => [
          ...prev,
          {
            username: "You",
            text: `🎁 Gifted ${giftAmount} Mobcoins to ${toUsername}`,
            created_at: new Date().toISOString(),
          },
        ]);
      }
    } catch (e) {
      console.error("gift failed", e);
      alert("Gift failed");
    } finally {
      setGiftProcessing(false);
    }
  }

  // toggle mute/unmute cleanly
  async function toggleMute() {
    try {
      const v = videoRef.current;
      if (!v) {
        setIsMuted((m) => !m);
        return;
      }
      const newMuted = !isMuted;
      v.muted = newMuted;
      setIsMuted(newMuted);

      // try to resume playback (some browsers require interaction)
      if (!newMuted) {
        await v.play().catch(() => {});
      }
    } catch (e) {
      console.warn("toggleMute failed", e);
      setIsMuted((m) => !m);
    }
  }

  // request fullscreen (with iOS fallback)
  async function enterFullscreen() {
    const v = videoRef.current;
    if (!v) return;
    try {
      if (v.requestFullscreen) {
        await v.requestFullscreen();
      } else if (v.webkitEnterFullscreen) {
        // iOS Safari native fullscreen for <video>
        v.webkitEnterFullscreen();
      } else if (v.webkitRequestFullscreen) {
        await v.webkitRequestFullscreen();
      }
    } catch (e) {
      console.warn("enterFullscreen failed", e);
    }
  }

  async function exitFullscreen() {
    try {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      } else if (document.webkitFullscreenElement) {
        await document.webkitCancelFullScreen?.();
      }
    } catch (e) {
      // ignore
    }
  }

  // keep video muted state synced if user changes it externally
  React.useEffect(() => {
    if (videoRef.current) {
      try {
        videoRef.current.muted = isMuted;
      } catch {}
    }
  }, [isMuted]);

  return (
    <div className="bg-black text-white w-full h-[100vh] flex flex-col">
      <div className="relative flex-1 flex items-center justify-center bg-black">
        <video
          ref={videoRef}
          autoPlay
          playsInline
          muted={isMuted}
          className="w-full h-[50vh] object-contain bg-black aspect-[9/16] sm:aspect-video"
          // no native controls to keep UI consistent; we provide our own mute/fullscreen buttons
          // controls
        />

        {/* Overlay controls on video */}
        <div className="absolute top-3 left-3 bg-black/60 px-3 py-1 rounded-full text-sm">
          👀 {viewerCount}
        </div>

        {/* Mute / Unmute button (always visible) */}
        <button
          aria-label={isMuted ? "Unmute video" : "Mute video"}
          onClick={toggleMute}
          className="absolute top-3 right-3 z-30 px-3 py-1 bg-black/60 rounded-full text-white text-sm"
        >
          {isMuted ? "🔇 Unmute" : "🔊"}
        </button>

        {/* Join/Leave on top-right (desktop fallback) */}
        <div className="absolute top-12 right-3 z-30">
          {!isJoined ? (
            <button
              onClick={joinLive}
              className="px-3 py-1 bg-red-600 text-white rounded-full text-sm"
            >
              Join
            </button>
          ) : (
            <button
              onClick={leaveLive}
              className="px-3 py-1 bg-gray-700 text-white rounded-full text-sm"
            >
              Leave
            </button>
          )}
        </div>

        {/* Comments overlay on mobile */}
        {isMobile ? (
          <div className="absolute left-3 bottom-3 right-3 z-20 pointer-events-auto">
            <div className="max-h-[55vh] overflow-y-auto space-y-2 pr-2">
              {comments.map((c, i) => (
                <div
                  key={i}
                  className={`text-sm p-2 rounded ${
                    c.special ? "bg-yellow-100 font-semibold" : "bg-black/50 text-white"
                  }`}
                >
                  <strong>{c.username}</strong>{" "}
                  <span className="text-gray-200">— {c.text}</span>
                </div>
              ))}
              <div ref={commentsEndRef} />
            </div>

            {/* input row overlaid */}
            <div className="flex items-center gap-2 mt-2 bg-black/40 backdrop-blur-sm rounded p-2">
              <input
                value={commentText}
                onChange={(e) => setCommentText(e.target.value)}
                placeholder="Say something..."
                className="flex-1 border rounded px-3 py-2 text-sm bg-white/10 text-white"
              />
              <button
                onClick={sendComment}
                className="px-4 py-2 bg-blue-600 text-white rounded"
              >
                Send
              </button>
            </div>
          </div>
        ) : null}
      </div>

      {/* Desktop: Comments + Gifting (preserve desktop UI) */}
      {!isMobile ? (
        <div className="relative bg-white text-black rounded-t-2xl p-3 max-h-[45vh] overflow-hidden">
          <div className="overflow-y-auto h-40 pr-2 space-y-2">
            {comments.map((c, i) => (
              <div
                key={i}
                className={`text-sm p-2 rounded ${
                  c.special ? "bg-yellow-100 font-semibold" : "bg-gray-50"
                }`}
              >
                <strong>{c.username}</strong>{" "}
                <span className="text-gray-600">— {c.text}</span>
              </div>
            ))}
            <div ref={commentsEndRef} />
          </div>

          {/* Input Row */}
          <div className="flex items-center gap-2 mt-2">
            <input
              value={commentText}
              onChange={(e) => setCommentText(e.target.value)}
              placeholder="Say something..."
              className="flex-1 border rounded px-3 py-2 text-sm"
            />
            <button onClick={sendComment} className="px-4 py-2 bg-blue-600 text-white rounded">
              Send
            </button>
          </div>

          {/* Gifting */}
          <div className="flex items-center gap-2 mt-3">
            <input
              value={giftAmount}
              onChange={(e) => setGiftAmount(e.target.value)}
              type="number"
              min="1"
              className="w-20 border rounded px-2 py-2 text-sm"
            />
            <button
              disabled={giftProcessing}
              onClick={sendGift}
              className="flex-1 px-4 py-2 bg-yellow-400 rounded font-semibold"
            >
              {giftProcessing ? "Processing..." : "🎁 Gift"}
            </button>
          </div>
        </div>
      ) : (
        // on mobile we still want a compact gifting row below the app area
        <div className="bg-white text-black p-3">
          <div className="flex items-center gap-2">
            <input
              value={giftAmount}
              onChange={(e) => setGiftAmount(e.target.value)}
              type="number"
              min="1"
              className="w-20 border rounded px-2 py-2 text-sm"
            />
            <button
              disabled={giftProcessing}
              onClick={sendGift}
              className="flex-1 px-4 py-2 bg-yellow-400 rounded font-semibold"
            >
              {giftProcessing ? "Processing..." : "🎁 Gift"}
            </button>
          </div>
        </div>
      )}

      {error ? <div className="text-center text-red-500 text-sm p-2">{error}</div> : null}
    </div>
  );
}
