    // TextMob iframe script
(function () {
  const PARENT_ORIGIN = "https://textmob.web.app" // replace with parent origin in production, e.g. "https://parent.example.com"

  function getCurrentUser() {
    return localStorage.getItem("currentUser") || "";
  }

  function postCurrentUserToParent() {
    const payload = { type: "currentUser", value: getCurrentUser() };
    try {
      window.parent.postMessage(JSON.stringify(payload), PARENT_ORIGIN);
    } catch (err) {
      console.error("postMessage to parent failed:", err);
    }
  }

  // send on load
  window.addEventListener("DOMContentLoaded", postCurrentUserToParent);

  // answer explicit requests from parent
  window.addEventListener("message", (ev) => {
    // optional origin check:
    // if (ev.origin !== "https://parent.example.com") return;

    let data;
    try {
      data = typeof ev.data === "string" ? JSON.parse(ev.data) : ev.data;
    } catch (err) { return; }

    if (!data || !data.type) return;

    if (data.type === "requestCurrentUser") {
      postCurrentUserToParent();
    }
  });
})();

    (function () {
      function safeCallDarkReader(fn) {
        // If DarkReader exists call immediately; otherwise poll a few times.
        if (window.DarkReader) {
          try { fn(); } catch (e) { console.error("DarkReader error", e); }
          return;
        }
        // Poll up to 30 times (3s) for library to become available
        let tries = 0;
        const t = setInterval(() => {
          tries += 1;
          if (window.DarkReader) {
            clearInterval(t);
            try { fn(); } catch (e) { console.error("DarkReader error", e); }
          } else if (tries > 30) {
            clearInterval(t);
            console.warn("DarkReader not found after waiting — preferences requiring DarkReader will be skipped.");
          }
        }, 100);
      }
    
      function applyDarkMode(mode) {
        // mode: 'system' | 'dark' | 'light' | 'custom'
        if (mode === "light") {
          // ensure DarkReader is disabled
          if (window.DarkReader) {
            try { window.DarkReader.disable(); } catch (e) { console.error(e); }
          }
          return;
        }
    
        // For the rest we need DarkReader
        safeCallDarkReader(() => {
          try {
            // give DarkReader access to fetch if available
            if (window.DarkReader && typeof window.DarkReader.setFetchMethod === "function") {
              window.DarkReader.setFetchMethod(window.fetch);
            }
          } catch (e) { /* ignore */ }
    
          if (mode === "dark") {
            window.DarkReader.enable({ brightness: 100, contrast: 100, sepia: 0 });
          } else if (mode === "custom") {
            window.DarkReader.enable({ brightness: 110, contrast: 90, sepia: 8 });
          } else {
            // system
            if (typeof window.DarkReader.auto === "function") {
              window.DarkReader.auto({ brightness: 100, contrast: 100, sepia: 0 });
            } else {
              // fallback: simple enable/disable based on system
              const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
              prefersDark ? window.DarkReader.enable() : window.DarkReader.disable();
            }
          }
        });
      }
    
      // bootstrap from localStorage (defaults)
      const savedMode = localStorage.getItem("darkMode") || "system";
      const savedTheme = localStorage.getItem("theme") || "blue";
    
      applyDarkMode(savedMode);
    
      // Listen to custom events from Preferences UI
      window.addEventListener("app:preferences:update", (e) => {
        try {
          const detail = e.detail || {};
          if (typeof detail.darkMode === "string") {
            localStorage.setItem("darkMode", detail.darkMode);
            applyDarkMode(detail.darkMode);
          }
        } catch (err) {
          console.error("app:preferences:update handler error", err);
        }
      });
    
      // Listen to storage events for cross-tab sync
      window.addEventListener("storage", (e) => {
        if (e.key === "darkMode" && e.newValue) {
          applyDarkMode(e.newValue);
        }
      });
    
      // react to OS theme changes when in 'system' mode
      if (window.matchMedia) {
        const mq = window.matchMedia("(prefers-color-scheme: dark)");
        // use addEventListener if available
        if (mq.addEventListener) {
          mq.addEventListener("change", () => {
            const current = localStorage.getItem("darkMode") || "system";
            if (current === "system") applyDarkMode("system");
          });
        } else if (mq.addListener) {
          mq.addListener(() => {
            const current = localStorage.getItem("darkMode") || "system";
            if (current === "system") applyDarkMode("system");
          });
        }
      }
    })();
    </script>

  <script>
function fetchProfile(username) {
  const cacheKey = `profile-${username}`;
  const apiCache = window._navCache || (window._navCache = {});

  if (apiCache[cacheKey]) {
    return apiCache[cacheKey];
  }

  return fetch(`/profile/${username}`, { cache: 'no-store' })
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((data) => {
      apiCache[cacheKey] = {
        fullname: data.fullname,
        profile_pic: data.profile_pic || 'https://res.cloudinary.com/dzvm9xe1i/image/upload/v1746095979/profile-pictures/e2st5nispbicnhnir9cf.jpg',
        notifications: data.notifications || [],
      };
      return apiCache[cacheKey];
    })
    .catch((error) => {
      console.error('Failed to fetch user profile:', error);
      return {
        fullname: username,
        profile_pic: 'https://res.cloudinary.com/dzvm9xe1i/image/upload/v1746095979/profile-pictures/e2st5nispbicnhnir9cf.jpg',
        notifications: [],
      };
    });
}

fetchProfile(localStorage.currentUser)

async function parseColor(imageUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "Anonymous";
    img.src = imageUrl;
    img.onload = () => {
      try {
        const colorThief = new ColorThief();
        const [r, g, b] = colorThief.getColor(img);
        resolve(rgbToHex(r, g, b));
      } catch (err) {
        reject("Error reading image color: " + err);
      }
    };
    img.onerror = () => reject("Image failed to load");
  });
}

function rgbToHex(r, g, b) {
  return "#" + [r, g, b]
    .map(x => x.toString(16).padStart(2, "0"))
    .join("");
}

function Sidebar() {
  const [collapsed, setCollapsed] = React.useState(() => {
    try {
      return JSON.parse(localStorage.getItem('sidebar-collapsed') || 'false');
    } catch {
      return false;
    }
  });

  const [profile, setProfile] = React.useState(null);
  const [unread, setUnread] = React.useState(null);
  const [showDropdown, setShowDropdown] = React.useState(false);

  // Debounce localStorage writes for collapsed state
  React.useEffect(() => {
    let timeout;
    timeout = setTimeout(() => {
      localStorage.setItem('sidebar-collapsed', JSON.stringify(collapsed));
    }, 300);
    return () => clearTimeout(timeout);
  }, [collapsed]);

  // Fetch profile and unread separately in parallel, with cache refresh every 5 minutes
  React.useEffect(() => {
    const username = localStorage.getItem('currentUser');
    if (!username) return;

    const profileCacheKey = `profile-${username}`;
    const unreadCacheKey = `unread-${username}`;
    const now = Date.now();
    const cacheExpiration = 5 * 60 * 1000; // 5 minutes

    const fetchIfNeeded = (key, url, setter) => {
      if (window._appCache[key] && now - window._appCache[key].timestamp < cacheExpiration) {
        setter(window._appCache[key].data);
      } else {
        fetch(url, { cache: 'no-store' })
          .then((r) => (r.ok ? r.json() : Promise.reject()))
          .then((data) => {
            window._appCache[key] = { data, timestamp: now };
            saveAppCache();
            setter(data);
            return data;
          })
          .catch((error) => {
            console.error(error);
            const fallback = key.includes('profile') ? {} : { unreadCount: 0 };
            setter(fallback);
          });
      }
    };

    Promise.all([
      new Promise((resolve) => fetchIfNeeded(profileCacheKey, `/profile/${username}`, (data) => { setProfile(data); resolve(data); })),
      new Promise((resolve) => fetchIfNeeded(unreadCacheKey, `/ms-unread?username=${username}`, (data) => { setUnread(data); resolve(data); })),
    ]);

function Search({ currentUsername }) {
  const [query, setQuery] = React.useState('');
  const [results, setResults] = React.useState([]);
  const abortCtrlRef = React.useRef(null);

  const handleInputChange = (e) => {
    const v = e.target.value;
    setQuery(v);
    if (!v.trim()) setResults([]);
  };

  React.useEffect(() => {
    const q = query.trim();
    if (!q) return;
    if (abortCtrlRef.current) abortCtrlRef.current.abort();
    const ac = new AbortController();
    abortCtrlRef.current = ac;

    fetch(`/search?query=${encodeURIComponent(q)}&currentUsername=${encodeURIComponent(currentUsername)}`, {
      signal: ac.signal,
      cache: 'no-store',
    })
      .then((res) => {
        if (!res.ok) throw new Error('Network response was not ok');
        return res.json();
      })
      .then((data) => setResults(data))
      .catch((err) => {
        if (err.name !== 'AbortError') console.error(err);
      });

    return () => ac.abort();
  }, [query, currentUsername]);

  return (
    <div className="relative flex-1">
      <input
        type="text"
        value={query}
        onChange={handleInputChange}
        placeholder="Search users…"
        className="w-full px-4 py-2 bg-gray-100 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors hover:bg-white"
        autoFocus
      />
      {results.length > 0 && (
        <div
          className="absolute top-full left-0 mt-2 w-full bg-white shadow-xl rounded-lg z-20"
          style={{ maxHeight: '70vh', overflow: 'auto' }}
        >
          <div className="overflow-y-auto scrollbar-thin scrollbar-thumb-gray-300">
            {results.map((user) => (
              <div
                key={user.username}
                className="flex items-center p-3 hover:bg-gray-50 cursor-pointer transition-colors"
                onClick={() => Lexum.navigate(`/@${user.username}`)}
              >
                <img
                  src={user.profile_pic || 'https://res.cloudinary.com/dzvm9xe1i/image/upload/v1746095979/profile-pictures/e2st5nispbicnhnir9cf.jpg'}
                  alt={user.username}
                  loading="lazy"
                  className="w-8 h-8 rounded-full mr-3 border-2 border-gray-200"
                />
                <div className="flex-1">

                  <div className="text-xs text-gray-500">@{user.username}</div>

      )}
    </div>
  );
}

function profile(username) {
  const cacheKey = `profile-${username}`;
  const now = Date.now();
  const cacheExpiration = 5 * 60 * 1000; // 5 minutes

  if (window._appCache[cacheKey] && now - window._appCache[cacheKey].timestamp < cacheExpiration) {
    return window._appCache[cacheKey].data;
  }

  const request = new XMLHttpRequest();
  request.open("GET", `/profile/${username}`, false); // synchronous
  request.send(null);

  let data;
  if (request.status === 200) {
    data = JSON.parse(request.responseText);
  } else {
    console.error("Failed to fetch user profile:", request.statusText);
    data = {
      fullname: username,
      profile_pic: "https://res.cloudinary.com/dzvm9xe1i/image/upload/v1746095979/profile-pictures/e2st5nispbicnhnir9cf.jpg",
      notifications: [],
    };
  }

  window._appCache[cacheKey] = { data, timestamp: now };
  saveAppCache();
  return data;
}

function Stories() {
  const [stories, setStories] = React.useState([]);
  const [viewerOpen, setViewerOpen] = React.useState(false);
  const [activeStory, setActiveStory] = React.useState(null);
  const [currentSparkIndex, setCurrentSparkIndex] = React.useState(0);
  const [durations, setDurations] = React.useState({});
  const [isMuted, setIsMuted] = React.useState(false);
  const timerRef = React.useRef(null);
  const videoRef = React.useRef(null);
  const progressContainerRef = React.useRef(null);

  // Fetch & group sparks (UNCHANGED)
  React.useEffect(() => {
    const currentUsername = localStorage.currentUser;
    if (!currentUsername) return;

    Promise.all([
      fetch(`/feed-sparks?username=${encodeURIComponent(currentUsername)}`)
        .then(res => res.ok ? res.json() : Promise.reject("feed-sparks failed")),
      fetch(`/get-sparks?username=${encodeURIComponent(currentUsername)}`)
        .then(res => res.ok ? res.json() : Promise.reject("get-sparks failed"))
    ])
      .then(([feedData, ownData]) => {
        const all = [...feedData, ...ownData];
        const seen = new Set();
        const uniq = all.filter(s => {
          const key = `${s.username}|${s.media}|${s.created_at}`;
          return seen.has(key) ? false : seen.add(key);
        });
        const grouped = uniq.reduce((acc, spark) => {
          const { username, profile_pic } = spark;
          if (!acc[username]) acc[username] = { username, profile_pic, sparks: [] };
          acc[username].sparks.push(spark);
          return acc;
        }, {});
        setStories(Object.values(grouped));
      })
      .catch(console.error);
  }, []);

  // Progress logic (UNCHANGED)
  React.useEffect(() => {
    if (!viewerOpen || !activeStory) return;
    clearTimeout(timerRef.current);

    const key = `${activeStory.username}|${currentSparkIndex}`;
    const duration = durations[key] || 20000;

    // restart CSS animation
    const innerBars = progressContainerRef.current.querySelectorAll('.progress-inner');
    innerBars.forEach((bar, idx) => {
      bar.style.transition = 'none';
      bar.style.width = idx < currentSparkIndex ? '100%' : '0%';
      if (idx === currentSparkIndex) {
        void bar.offsetWidth;
        bar.style.transition = `width ${duration}ms linear`;
        bar.style.width = '100%';
      }
    });

    timerRef.current = setTimeout(() => {
      if (currentSparkIndex < activeStory.sparks.length - 1)  
        setCurrentSparkIndex(i => i + 1);
      else 
        closeViewer();
    }, duration);

    return () => clearTimeout(timerRef.current);
  }, [currentSparkIndex, viewerOpen, activeStory, durations]);

  const openViewer = (story) => {
    setActiveStory(story);
    setCurrentSparkIndex(0);
    setViewerOpen(true);
  };
  const closeViewer = () => {
    clearTimeout(timerRef.current);
    setViewerOpen(false);
    setActiveStory(null);
    setCurrentSparkIndex(0);
  };
  const nextSpark = () => {
    if (currentSparkIndex < activeStory.sparks.length - 1) setCurrentSparkIndex(i => i + 1);
    else closeViewer();
  };
  const prevSpark = () => {
    if (currentSparkIndex > 0) setCurrentSparkIndex(i => i - 1);
  };

  const handleHoldStart = () => {
    clearTimeout(timerRef.current);
    if (videoRef.current && !videoRef.current.paused) videoRef.current.pause();
    progressContainerRef.current.classList.add('holding');
  };
  const handleHoldEnd = () => {
    if (videoRef.current && videoRef.current.paused) videoRef.current.play();
    progressContainerRef.current.classList.remove('holding');
    // restart timer with remaining width
    const bar = progressContainerRef.current.querySelectorAll('.progress-inner')[currentSparkIndex];
    const comp = getComputedStyle(bar);

function SafeHTML({ html }) {
  const [processedHTML, setProcessedHTML] = React.useState('');

  React.useEffect(() => {
    async function parseAndValidate(html) {
      // Mentions: allow spaces inside
      const mentionRegex = /@([\w][\w\s]+)/g;
      const mentions = [...html.matchAll(mentionRegex)].map((m) => m[1].trim());

      // Deduplicate mentions
      const uniqueMentions = Array.from(new Set(mentions));

      const validMentions = new Set();

      // Option 1: batch check if your API supports it
      // const res = await fetch(`/profiles?users=${uniqueMentions.map(encodeURIComponent).join(',')}`)
      // const data = await res.json()
      // data.valid.forEach(username => validMentions.add(username))

      // Option 2: fallback, check individually but deduped
      await Promise.allSettled(
        uniqueMentions.map(async (username) => {
          try {
            const res = await fetch(`/profile/${encodeURIComponent(username)}`);
            const data = await res.json();
            if (!data.error) validMentions.add(username);
          } catch (_) {}
        })
      );

      // Replace @mentions with links (only if valid)
      let parsed = html.replace(mentionRegex, (match, username) => {
        username = username.trim();
        if (validMentions.has(username)) {
          return `<a data-lexum href="/@${encodeURIComponent(
            username
          )}" class="text-blue-500 hover:underline">@${username}</a>`;
        }
        return match;
      });

      // Improved URL regex (no <, >, etc.)
      const urlRegex = /\bhttps?:\/\/[^\s<>"']+[^\s<>"'.,!?;:)]/g;

      parsed = parsed.replace(urlRegex, (url) => {
        return `<a href="/link?url=${encodeURIComponent(
          url
        )}" class="text-blue-500 underline" target="_blank" rel="noopener noreferrer">${url}</a>`;
      });

      setProcessedHTML(DOMPurify.sanitize(parsed));
    }

    parseAndValidate(html);
  }, [html]);

  return (
    <div
      className="prose max-w-none"
      dangerouslySetInnerHTML={{ __html: processedHTML }}
    />
  );
}

function timeAgo(dateStr) {
  // Parse any date input: string, timestamp, Date object
  let past;

  if (dateStr instanceof Date) {
    past = dateStr.getTime();
  } else if (typeof dateStr === 'number') {
    past = dateStr;
  } else if (typeof dateStr === 'string') {
    past = Date.parse(dateStr.trim());
    if (isNaN(past)) {
      const temp = new Date(dateStr);
      past = isNaN(temp.getTime()) ? NaN : temp.getTime();
    }
  } else {
    return "Invalid date";
  }

  if (isNaN(past)) return "Invalid date";
  if (past > Date.now()) return "Just now"; // future or very recent

  const diffMs = Date.now() - past;
  const diffSec = Math.floor(diffMs / 1000);
  const diffMin = Math.floor(diffSec / 60);
  const diffHr = Math.floor(diffMin / 60);
  const diffDay = Math.floor(diffHr / 24);
  const diffWk = Math.floor(diffDay / 7);
  const diffMth = Math.floor(diffDay / 30.436875); // accurate average month
  const diffYr = Math.floor(diffDay / 365.25);

  // Helper for plural
  const plural = (num, word) => `${num} ${word}${num === 1 ? '' : 's'}`;

  if (diffSec < 60) {
    return diffSec < 5 ? "Just now" : plural(diffSec, "second") + " ago";
  }
  if (diffMin < 60) {
    return plural(diffMin, "minute") + " ago";
  }
  if (diffHr < 24) {
    return plural(diffHr, "hour") + " ago";
  }
  if (diffDay < 7) {
    return plural(diffDay, "day") + " ago";
  }
  if (diffWk < 4) {
    return plural(diffWk, "week") + " ago";
  }
  if (diffMth < 12) {
    return plural(diffMth, "month") + " ago";
  }
  return plural(diffYr, "year") + " ago";
}

  // Helper: compute grouped counts and detect user reaction
  function computeReactionCounts(reactions, currentUser) {
    var counts = {};
    var userReaction = null;
    if (!reactions || !Array.isArray(reactions)) return { counts: {}, userReaction: null };
    reactions.forEach(function (r) {
      if (!r || !r.reaction) return;
      counts[r.reaction] = counts[r.reaction] || 0;
      counts[r.reaction] = counts[r.reaction] + 1;
      if (r.username === currentUser) {
        userReaction = r.reaction;
      }
    });
    return { counts: counts, userReaction: userReaction };
  }

  // Fallback fetch if post.reactions missing server-side
  async function fetchReactionsForPost(postId) {
    try {
      var res = await fetch('/get-post-reactions?postId=' + encodeURIComponent(postId));
      if (!res.ok) throw new Error('Failed to fetch reactions');
      var data = await res.json(); // expect { reactions: [...] } or { counts: {...}, userReaction: '❤️' }
      if (data && data.reactions) {
        var computed = computeReactionCounts(data.reactions, localStorage.currentUser);
        setReactionCountsCache(function (prev) {
          var copy = Object.assign({}, prev);
          copy[String(postId)] = computed;
          return copy;
        });
      } else if (data && data.counts) {
        setReactionCountsCache(function (prev) {
          var copy = Object.assign({}, prev);
          copy[String(postId)] = { counts: data.counts, userReaction: data.userReaction || null };
          return copy;
        });
      }
    } catch (e) {
      console.error('Failed to load reactions for post', postId, e);
    }
  }

  // Optimistic react handler
  function handleReact(postId, reaction, etext) {
    var currentUser = localStorage.currentUser;
    // update UI: posts reactions array (if present) and counts cache
    setPosts(function (prev) {
      return prev.map(function (p) {
        if (!p || p.id !== postId) return p;
        var newReactions = [];
        if (p.reactions && Array.isArray(p.reactions)) {
          // remove any existing reaction by this user
          newReactions = p.reactions.filter(function (r) { return r.username !== currentUser; });
        } else {
          newReactions = [];
        }
        // if user clicked same reaction again -> remove (toggle)
        var existing = (p.reactions || []).find(function (r) { return r.username === currentUser; });
        if (existing && existing.reaction === reaction) {
          // removal case - already filtered out
        } else {
          newReactions.push({ username: currentUser, type: "emoji", reaction: reaction, etext: etext });
        }
        return Object.assign({}, p, { reactions: newReactions });
      });
    });

    // update cache from posts state (best-effort)
    setReactionCountsCache(function (prev) {
      var copy = Object.assign({}, prev);
      var prevObj = copy[String(postId)] || { counts: {}, userReaction: null };
      try {
        var postNow = posts.find(function (x) { return x && x.id === postId; });
        var reactionsArr = (postNow && postNow.reactions) ? postNow.reactions.slice() : [];
        reactionsArr = reactionsArr.filter(function (r) { return r.username !== currentUser; });
        var existed = null;
        if (postNow && postNow.reactions) existed = postNow.reactions.find(function (r) { return r.username === currentUser; });
        if (existed && existed.reaction === reaction) {
          // removal case - nothing to add
        } else {
          reactionsArr.push({ username: currentUser, type: "emoji", reaction: reaction, etext: etext });
        }
        copy[String(postId)] = computeReactionCounts(reactionsArr, currentUser);
      } catch (e) {
        if (prevObj.userReaction === reaction) {
          prevObj.userReaction = null;
          prevObj.counts[reaction] = Math.max(0, (prevObj.counts[reaction] || 1) - 1);
        } else {
          if (prevObj.userReaction) {
            prevObj.counts[prevObj.userReaction] = Math.max(0, (prevObj.counts[prevObj.userReaction] || 1) - 1);
          }
          prevObj.userReaction = reaction;
          prevObj.counts[reaction] = (prevObj.counts[reaction] || 0) + 1;
        }
        copy[String(postId)] = prevObj;
      }
      return copy;
    });

    // send to server
    fetch('/react-post', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ postId: postId, username: localStorage.currentUser, reaction: reaction, etext: etext }),
    }).then(function (res) {
      if (!res.ok) {
        // on failure, refetch accurate reactions for post
        fetchReactionsForPost(postId);
      } else {
        res.json().then(function (data) {
          if (data && data.reactions) {
            var computed = computeReactionCounts(data.reactions, localStorage.currentUser);
            setReactionCountsCache(function (prev) {
              var copy = Object.assign({}, prev);
              copy[String(postId)] = computed;
              return copy;
            });
          }
        }).catch(function () {});
      }
    }).catch(function () {
      // network fail -> refetch after short delay
      setTimeout(function () { fetchReactionsForPost(postId); }, 1500);
    });
  }

// Assumes React is in scope (import React from 'react')
// Uses VideoPlayer component already available in your codebase.

const ModalGallery = ({ media, poster }) => {
  // --- hooks first (always) ---
  const [open, setOpen] = React.useState(false);
  const [currentIndex, setCurrentIndex] = React.useState(0);
  const [touchStart, setTouchStart] = React.useState(null);

  // normalize media input
  const items = Array.isArray(media) ? media : [];
  const total = items.length;

  // helpers
  const isVideo = function (url) {
    return /\.(mp4|webm|ogg)$/i.test(String(url || ''));
  };

  const showCount = total > 6 ? 6 : total;
  const hasExtra = total > 6;
  const extraCount = total - 6;

  const handleOpen = function (index) {
    setCurrentIndex(index);
    setOpen(true);
  };

  const next = function () {
    setCurrentIndex(function (prev) { return (prev + 1) % (total || 1); });
  };

  const prev = function () {
    setCurrentIndex(function (prev) { return (prev - 1 + (total || 1)) % (total || 1); });
  };

  var minSwipeDistance = 50;

  var handleTouchStart = function (e) {
    if (e && e.targetTouches && e.targetTouches[0]) {
      setTouchStart(e.targetTouches[0].clientX);
    } else {
      setTouchStart(null);
    }
  };

  var handleTouchEnd = function (e) {
    if (!touchStart) return;
    if (!e || !e.changedTouches || !e.changedTouches[0]) {
      setTouchStart(null);
      return;
    }
    var currentTouchEnd = e.changedTouches[0].clientX;
    var diff = touchStart - currentTouchEnd;
    if (Math.abs(diff) > minSwipeDistance) {
      if (diff > 0) {
        next();
      } else {
        prev();
      }
    }
    setTouchStart(null);
  };

  // keyboard navigation while modal open
  React.useEffect(function () {
    if (!open) return undefined;
    var handleKeyDown = function (e) {
      if (!e) return;
      if (e.key === 'Escape') {
        setOpen(false);
      } else if (e.key === 'ArrowLeft') {
        prev();
      } else if (e.key === 'ArrowRight') {
        next();
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return function () { window.removeEventListener('keydown', handleKeyDown); };
  }, [open, total]); // total included defensively

  if (total === 0) return null;

  // if only one media item — show it inline full-size so user sees it immediately
  if (total === 1) {
    var singleUrl = items[0];
    var singleIsVideo = isVideo(singleUrl);

    return (
      React.createElement(React.Fragment, null,
        React.createElement("div", { className: "mb-4" },
          singleIsVideo
            ? React.createElement(VideoPlayer, { src: singleUrl, qualities: ['360p','720p','1080p'] })
            : React.createElement("img", {
                src: singleUrl,
                alt: "Media 1",
                className: "max-w-full h-auto object-contain rounded-lg cursor-zoom-in",
                onClick: function () { handleOpen(0); },
                loading: "lazy"
              })
        ),

        // keep modal available if they want zoom/navigation
        open && React.createElement("div", { className: "fixed inset-0 bg-black z-50 flex items-center justify-center p-4" },

function ConnectButto({ targetUsername, currentUsername, onUpdate }) {
    const [btnLoading, setBtnLoading] = React.useState(true);
    const [state, setState] = React.useState(null);

    React.useEffect(() => {
      let mounted = true;
      async function fetchProfile() {
        try {
          const res = await fetch(`/profile/${encodeURIComponent(targetUsername)}`);
          const data = await res.json();
          if (!mounted) return;
          const isFriend = Array.isArray(data.friends) && data.friends.includes(currentUsername);
          const isFollowing = Array.isArray(data.followers) && data.followers.includes(currentUsername);
          const profileType = (data.profile_type || "").toLowerCase();
          setState(profileType === "individual" ? (isFriend ? "friended" : "not_friended") : (isFollowing ? "following" : "not_following"));
        } catch (err) {
          console.error(err);
        } finally {
          if (mounted) setBtnLoading(false);
        }
      }
      fetchProfile();
      return () => { mounted = false; };
    }, [targetUsername, currentUsername]);

    const handleClick = async () => {
      if (btnLoading || !state) return;
      setBtnLoading(true);
      try {
        const res = await fetch("/connect", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ currentUsername, targetUsername }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to connect");
        const nextState = {
          friended: "not_friended",
          not_friended: "friended",
          following: "not_following",
          not_following: "following",
        }[state];
        setState(nextState);
        onUpdate?.(nextState);
      } catch (err) {
        alert(err.message || "Connection error");
      } finally {
        setBtnLoading(false);
      }
    };

    const labelMap = { friended: "Friends", not_friended: "Add Friend", following: "Unfollow", not_following: "Follow" };
    const isActive = state === "friended" || state === "following";

    return (
      <button
  onClick={handleClick}
  disabled={btnLoading}
  className={`rounded-full p-2 text-xs font-medium shadow-sm focus:outline-none transition-colors duration-150
    ${btnLoading
      ? "bg-gray-200 text-gray-500 cursor-wait"
      : isActive
        ? "bg-[var(--dodger)] text-white hover:bg-[rgba(30,144,255,0.9)]"
        : "bg-white border border-[var(--dodger)] text-[var(--dodger)] hover:bg-[rgba(30,144,255,0.06)]"
    }`}
>
  {btnLoading ? "..." : labelMap[state] || "Connect"}
</button>
    );
  }

  ];

    e?.stopPropagation();

    } else if (!ad) {
      v.pause();
    }
  };

  // Mute/unmute
  const toggleMute = (e) => {
    e.stopPropagation();

    else setVolume(v.volume);

  const handleVolumeChange = (e) => {
    e.stopPropagation();
    const v = videoRef.current;

    setMuted(val === 0);

  // Fullscreen toggle
  const toggleFullscreen = (e) => {
    e.stopPropagation();
    const el = containerRef.current;

    } else {
      document.exitFullscreen();

  // Picture-in-Picture toggle
  const togglePip = (e) => {

  const toggleTheaterMode = (e) => {

    const v = videoRef.current;

  // Ad handling
 React.useEffect(() => {

function isRealBrowser() {
  const ua = navigator.userAgent || navigator.vendor || window.opera;
  const inAppBrowserKeywords = [
    "FBAN", "FBAV", "Instagram", "Messenger", "Line", "WeChat", "Snapchat", "Twitter",
    "WhatsApp", "TikTok", "Telegram", "Pinterest", "LinkedIn",
    "wv", "WebView", "OPR/", "OPT/", "YaApp"
  ];
  return !inAppBrowserKeywords.some(k => ua.includes(k));
}

function FeatureModal() {
  const [unseen, setUnseen] = React.useState([]);
  const [index, setIndex] = React.useState(0);
  const [feedback, setFeedback] = React.useState("");
  const [isBrowser, setIsBrowser] = React.useState(false);

  React.useEffect(() => {
    setIsBrowser(isRealBrowser());
    const seen = JSON.parse(localStorage.getItem("seenFeatures") || "[]");

    // filter: allow survey step to reappear if not taken
    const filtered = FEATURES.filter(f => {
      if (f.isSurveyStep) {
        return !seen.includes("surveyCompleted"); // special marker for survey
      }
      return !seen.includes(f.id);
    });

    setUnseen(filtered);

    if (filtered.length > 0 && !filtered[0].isSurveyStep) {
      const updatedSeen = [...seen, filtered[0].id];
      localStorage.setItem("seenFeatures", JSON.stringify(updatedSeen));
    }
  }, []);

  async function handleNext(skipSurvey = false) {
    const feature = unseen[index];

    if (feature.feedback && feedback.trim()) {
      console.log(feature.id, feedback);
    }
    setFeedback("");

    const nextIndex = index + 1;
    if (nextIndex < unseen.length) {
      const seen = JSON.parse(localStorage.getItem("seenFeatures") || "[]");
      const nextFeature = unseen[nextIndex];

      // Only mark as seen if not survey OR if user took survey
      if (!nextFeature.isSurveyStep) {
        seen.push(nextFeature.id);
        localStorage.setItem("seenFeatures", JSON.stringify(seen));
      }

      setIndex(nextIndex);
    } else {
      setUnseen([]);
    }
  }

  function handleSurveyTaken() {
    const seen = JSON.parse(localStorage.getItem("seenFeatures") || "[]");
    seen.push("surveyCompleted"); // mark survey as done
    localStorage.setItem("seenFeatures", JSON.stringify(seen));
    window.open("https://forms.gle/1v2DkzcntyvTsA4Y7", "_blank");
    handleNext();
  }

  if (unseen.length === 0) return null;

  const feature = unseen[index];

  return (
    <div
  style={{ zIndex: "9999" }}
  className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 animate-fade-in"
>
  <div className="bg-white w-full max-w-lg rounded-2xl shadow-xl flex flex-col max-h-[90vh]">
    {/* Image / Illustration */}
    <div className="flex-1 overflow-y-auto flex items-center justify-center p-6">
      {feature.image && (
        <img
          src={feature.image}
          alt={feature.title}
          className="max-h-56 w-auto animate-slide-up"
        />
      )}
    </div>

    {/* Content Section */}
    <div className="p-6 text-center border-t border-gray-200">
      <h2 className="text-2xl font-bold text-gray-900 mb-3">{feature.title}</h2>
      <p className="text-gray-600 mb-4 leading-relaxed">{feature.description}</p>

      {feature.feedback && (
        <textarea
          value={feedback}
          onChange={(e) => setFeedback(e.target.value)}
          placeholder="What do you think about this? Any feedback?"
          className="w-full border border-gray-300 rounded-lg p-3 mb-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      )}

      {feature.isDownloadStep && isBrowser && (
        <button
          onClick={() =>
            window.open(
              "https://github.com/ISMO123-CMYK/Textmob-web-app/raw/refs/heads/main/thetextmobapp.apk",
              "_blank"
            )
          }
          className="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-full font-medium transition-all duration-300 w-full mb-3"
        >
          📥 Download our App
        </button>
      )}

      {feature.isSurveyStep ? (
        <div className="flex gap-3 justify-center">
          <button
            onClick={handleSurveyTaken}
            className="flex-1 bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-full font-medium transition-all duration-300"
          >
            Take Survey
          </button>
          <button
            onClick={() => handleNext(true)}
            className="flex-1 bg-gray-400 hover:bg-gray-500 text-white px-6 py-3 rounded-full font-medium transition-all duration-300"
          >
            Skip for now
          </button>
        </div>
      ) : (
        <button
          onClick={() => handleNext()}
          className="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-full font-medium transition-all duration-300"
        >
          {index + 1 < unseen.length ? "Next" : "Finish"}
        </button>
      )}
    </div>
  </div>
</div>
    );
}

async function fetchAndSendNotifications(username) {
  try {
    const res = await fetch(`/notifications?username=${encodeURIComponent(username)}`);
    const data = await res.json();

    if (data.unread && data.unread.length > 0) {
      // Send unread notifications to parent (.web.app)
      window.parent.postMessage(
        { type: "notifications", payload: data.unread },
        "https://textmob.web.app" // your firebase URL
      );
    }
  } catch (err) {
    console.error("Error fetching notifications:", err);
  }
}

function QuickShare() {
  const MODE_NONE = '';
  const MODE_SEND = 'send';
  const MODE_RECEIVE = 'receive';
  const MAX_BYTES = 1 * 1024 * 1024 * 1024;
  const DOWNLOAD_DATAURL_THRESHOLD_BYTES = 10 * 1024 * 1024;

  const [mode, setMode] = useState(MODE_NONE);
  const [file, setFile] = useState(null);
  const [fileMeta, setFileMeta] = useState(null);
  const [uploadProgress, setUploadProgress] = useState(0);
  const [downloadProgress, setDownloadProgress] = useState(0);
  const [status, setStatus] = useState('idle');
  const [code, setCode] = useState('');
  const evtRef = useRef(null);
  const downloadUrlRef = useRef(null);
  const dropRef = useRef(null);
  const liveRef = useRef(null);

  useEffect(() => {
    return () => {
      try { if (evtRef.current) { evtRef.current.close(); } } catch (e) {}
      try { if (downloadUrlRef.current) { URL.revokeObjectURL(downloadUrlRef.current); } } catch (e) {}
    };
  }, []);

  function humanFileSize(bytes) {
    if (bytes === 0) return '0 B';
    if (!bytes) return '';
    const thresh = 1024;
    if (Math.abs(bytes) < thresh) {
      return bytes + ' B';
    }
    const units = ['KB', 'MB', 'GB', 'TB'];
    let u = -1;
    do {
      bytes = bytes / thresh;
      ++u;
    } while (Math.abs(bytes) >= thresh && u < units.length - 1);
    return bytes.toFixed(1) + ' ' + units[u];
  }

  function shortThumb(name) {
    if (!name) return 'F';
    const parts = name.split('.');
    const ext = parts.length > 1 ? parts[parts.length - 1].toUpperCase() : name.charAt(0).toUpperCase();
    if (!ext || ext.length > 6) return name.charAt(0).toUpperCase();
    return ext;
  }

  function isInWebView() {
    try {
      const ua = navigator.userAgent || '';
      const wv = ua.indexOf('wv') !== -1;
      const fb = ua.indexOf('FBAN') !== -1 || ua.indexOf('FBAV') !== -1;
      const ig = ua.indexOf('Instagram') !== -1;
      return wv || fb || ig;
    } catch (err) {
      return false;
    }
  }

  function subscribeSSE(c) {
    try {
      if (evtRef.current) {
        try { evtRef.current.close(); } catch (e) {}
        evtRef.current = null;
      }
      const url = '/quick/events/' + encodeURIComponent(c);
      const es = new EventSource(url);
      evtRef.current = es;

      es.addEventListener('uploaded', (ev) => {
        try {
          const d = JSON.parse(ev.data);
          setStatus('ready_to_download');
          setFileMeta({ filename: d.filename, size: d.size, type: d.mimeType });
          announceToLive('File uploaded and ready to download.');
        } catch (e) {}
      });

      es.addEventListener('download_start', () => { setStatus('downloading'); announceToLive('Download started.'); });
      es.addEventListener('download_progress', (ev) => {
        try {
          const d = JSON.parse(ev.data);
          if (d && d.pct !== undefined) setDownloadProgress(d.pct);
        } catch (e) {}
      });

      es.addEventListener('download_complete', () => {
        setStatus('done');
        setDownloadProgress(100);
        announceToLive('Download complete.');
      });

      es.addEventListener('expired', () => {
        setStatus('error');
        announceToLive('This file code has expired.');
      });

      es.onerror = () => {};
    } catch (err) {}
  }

  function announceToLive(text) {
    try {
      if (liveRef.current) {
        liveRef.current.textContent = text;
      }
    } catch (e) {}
  }

  function handleFilePick(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) {
      setFile(null);
      setFileMeta(null);
      return;
    }
    if (f.size > MAX_BYTES) {
      alert('File too large. Max allowed is 1 GB.');
      e.target.value = '';
      setFile(null);
      setFileMeta(null);
      return;
    }
    setFile(f);
    setFileMeta({ filename: f.name, size: f.size, type: f.type || 'application/octet-stream' });
  }

  useEffect(() => {
    const el = dropRef.current;
    if (!el) return;
    function prevent(e) { e.preventDefault(); e.stopPropagation(); }
    function onDragOver(e) { prevent(e); el.classList.add('ring', 'ring-2', 'ring-blue-200'); }
    function onDragLeave(e) { prevent(e); el.classList.remove('ring', 'ring-2', 'ring-blue-200'); }
    function onDrop(e) {
      prevent(e);
      el.classNameList.remove('ring', 'ring-2', 'ring-blue-200');
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) {
        if (f.size > MAX_BYTES) { alert('File too large. Max 1 GB.'); return; }
        setFile(f);
        setFileMeta({ filename: f.name, size: f.size, type: f.type || 'application/octet-stream' });
      }
    }

    el.addEventListener('dragover', onDragOver);
    el.addEventListener('dragleave', onDragLeave);
    el.addEventListener('drop', onDrop);
    return () => {
      el.removeEventListener('dragover', onDragOver);
      el.removeEventListener('dragleave', onDragLeave);
      el.removeEventListener('drop', onDrop);
    };
  }, [dropRef.current]);

  function handleUpload(ev) {
    ev && ev.preventDefault && ev.preventDefault();
    if (!file) { alert('Pick a file first'); return; }
    setUploadProgress(0);
    setStatus('uploading');
    announceToLive('Uploading file...');
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/quick/upload', true);
    xhr.setRequestHeader('x-filename', file.name);
    xhr.setRequestHeader('x-mime-type', file.type || 'application/octet-stream');

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        setUploadProgress(pct);
      }
    };

    xhr.onreadystatechange = () => {
      if (xhr.readyState === 4) {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            const resp = JSON.parse(xhr.responseText);
            if (resp && resp.code) {
              setCode(resp.code);
              setStatus('waiting');
              announceToLive('Upload complete. Share the 4 digit code.');
              subscribeSSE(resp.code);
              try { navigator.clipboard.writeText(resp.code); } catch (e) {}
            } else {
              setStatus('error');
              alert('Upload response malformed.');
            }
          } catch (e) {
            setStatus('error');
            alert('Upload failed.');
          }
        } else if (xhr.status === 413) {
          alert('Server rejected file: too large.');
          setStatus('error');
        } else {
          setStatus('error');
          alert('Upload failed (status ' + xhr.status + ').');
        }
      }
    };

    xhr.onerror = () => {
      setStatus('error');
      alert('Upload failed due to a network error.');
    };

    xhr.send(file);
  }

  async function probeMetadata(c) {
    if (!c || !/^[0-9]{4}$/.test(c)) { alert('Please enter a valid 4 digit code.'); return; }
    setFileMeta(null);
    setDownloadProgress(0);
    setStatus('probing');
    announceToLive('Checking code...');
    try {
      const metaResp = await fetch('/quick/meta/' + encodeURIComponent(c));
      if (metaResp.ok) {
        const meta = await metaResp.json();
        setFileMeta({ filename: meta.filename, size: meta.size, type: meta.mimeType });
        setStatus('ready_to_download');
        subscribeSSE(c);
        announceToLive('File available: ' + meta.filename);
        return;
      }
      const headResp = await fetch('/quick/download/' + encodeURIComponent(c), { method: 'HEAD' });
      if (!headResp.ok) { setStatus('error'); alert('File not found or expired.'); return; }
      const ct = headResp.headers.get('content-type') || '';
      const cl = headResp.headers.get('content-length') || '0';
      const cd = headResp.headers.get('content-disposition') || '';
      const m = /filename=\"([^"]+)\"/.exec(cd);
      const fname = (m && m[1]) ? m[1] : ('file-' + Date.now());
      const size = parseInt(cl || '0', 10) || 0;
      setFileMeta({ filename: fname, size: size, type: ct });
      setStatus('ready_to_download');
      subscribeSSE(c);
      announceToLive('File available: ' + fname);
    } catch (err) {
      setStatus('error');
      alert('Could not check file. Try again.');
    }
  }

  async function handleDownload(ev) {
    ev && ev.preventDefault && ev.preventDefault();
    if (!code || !/^[0-9]{4}$/.test(code)) { alert('Enter a valid 4 digit code.'); return; }
    setDownloadProgress(0);
    setStatus('downloading');
    announceToLive('Starting download...');
    try {
      const downloadUrl = '/quick/download/' + encodeURIComponent(code);
      if (isInWebView()) {
        const w = window.open(downloadUrl, '_blank');
        if (!w) {
          alert('Could not open download link. Please open this URL in your browser: ' + window.location.origin + downloadUrl);
          setStatus('error');
          return;
        }
        setStatus('done');
        setDownloadProgress(100);
        announceToLive('Download link opened in new window.');
        return;
      }
      const resp = await fetch(downloadUrl);
      if (!resp.ok) { setStatus('error'); alert('Download failed with status ' + resp.status); return; }
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      try {
        if (downloadUrlRef.current) { try { URL.revokeObjectURL(downloadUrlRef.current); } catch (e) {} }
        downloadUrlRef.current = url;
        const a = document.createElement('a');
        a.href = url;
        a.download = fileMeta && fileMeta.filename ? fileMeta.filename : 'download';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setStatus('done');
        setDownloadProgress(100);
        announceToLive('Download complete.');
      } catch (err) {
        alert('Failed to trigger download.');
        setStatus('error');
      }
    } catch (err) {
      setStatus('error');
      alert('Download failed.');
    }
  }

  function resetAll() {
    setMode(MODE_NONE);
    setFile(null);
    setFileMeta(null);
    setCode('');
    setUploadProgress(0);
    setDownloadProgress(0);
    setStatus('idle');
    try { if (evtRef.current) { evtRef.current.close(); } } catch (e) {}
    evtRef.current = null;
    try { if (downloadUrlRef.current) { URL.revokeObjectURL(downloadUrlRef.current); } } catch (e) {}
    downloadUrlRef.current = null;
    announceToLive('Reset.');
  }

  function copyCodeToClipboard() {
    try {
      if (!code) return;
      navigator.clipboard.writeText(code);
      announceToLive('Code copied to clipboard.');
    } catch (e) {
      alert('Could not copy automatically. Select and copy the code.');
    }
  }

  function buildQrSrc(c) {
    if (!c) return '';
    return 'https://chart.googleapis.com/chart?cht=qr&chs=200x200&chl=' + encodeURIComponent(window.location.origin + '/quick/download/' + c);
  }

  useEffect(() => {
    function onKey(e) {
      if (e.key === 'Escape') resetAll();
      if (e.key === 'Enter' && mode === MODE_NONE) setMode(MODE_SEND);
    }
    window.addEventListener('keydown', onKey);
    return () => { window.removeEventListener('keydown', onKey); };
  }, [mode]);

  function IconSend() {
    return (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z" fill="currentColor"></path>
      </svg>
    );
  }

  function IconReceive() {
    return (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2v20M2 12h20" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"></path>
      </svg>
    );
  }

  function IconCloudUpload() {
    return (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3v10" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"></path>
        <path d="M21 15a4 4 0 00-4-4h-1" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"></path>
      </svg>
    );
  }

  function IconDownload() {
    return (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3v12" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"></path>
        <path d="M21 21H3" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"></path>
      </svg>
    );
  }

  return (
    <div className="p-6">
      <div className="w-full max-w-3xl bg-white rounded-xl border border-slate-100 p-6">
        <div className="flex items-start justify-between">
          <div className="flex items-center gap-4">
            <div className="rounded-md bg-blue-50 w-12 h-12 flex items-center justify-center text-blue-600">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 12h18M12 3v18" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"></path>
              </svg>
            </div>
            <div>
              <div className="text-slate-900 font-semibold text-lg">QuickShare Pro</div>
              <div className="text-slate-500 text-sm">Secure ephemeral 1:1 file transfers up to 1 GB</div>
            </div>
          </div>
          <div className="flex gap-2">
            <button onClick={resetAll} className="px-3 py-2 rounded-md bg-white border border-slate-100 text-slate-600 text-sm hover:bg-slate-50 transition" aria-label="Reset quickshare">
              Reset
            </button>
          </div>
        </div>

        <div className="mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">
          <div className="md:col-span-2">
            {mode === MODE_NONE && (
              <div className="flex gap-3">
                <button onClick={() => setMode(MODE_SEND)} className="flex items-center gap-2 px-4 py-3 rounded-lg bg-blue-600 text-white font-semibold hover:scale-[1.01] transition" aria-label="Send file">
                  <IconSend />
                  <span>Send a file</span>
                </button>
                <button onClick={() => setMode(MODE_RECEIVE)} className="flex items-center gap-2 px-4 py-3 rounded-lg bg-white text-blue-600 border border-blue-100 font-semibold hover:shadow-sm transition" aria-label="Receive file">
                  <IconReceive />
                  <span>Receive a file</span>
                </button>
              </div>
            )}

            {mode === MODE_SEND && (
              <div className="bg-slate-50 rounded-lg p-4">
                <div ref={dropRef} className="p-4 rounded-lg border border-dashed border-slate-200 bg-white flex items-center gap-4" role="region" aria-label="File drop zone">
                  <div className="flex-1">
                    <div className="text-sm text-slate-600 mb-2">Choose file to send up to 1 GB</div>
                    <input type="file" onChange={handleFilePick} className="block w-full text-sm text-slate-700" aria-label="Choose file to upload" />
                    <div className="text-xs text-slate-400 mt-2">Or drag and drop a file here</div>
                  </div>
                  <div className="flex flex-col items-end gap-2">
                    <div className="text-xs text-slate-400">Selected</div>
                    <button onClick={handleUpload} className="flex items-center gap-2 px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold" aria-label="Upload file">
                      <IconCloudUpload />
                      Upload
                    </button>
                  </div>
                </div>

                {file && (
                  <div className="mt-4 flex items-center gap-4">
                    <div className="w-16 h-16 rounded-md bg-blue-50 flex items-center justify-center text-blue-600 font-bold text-lg">{shortThumb(file.name)}</div>

                      <div className="text-sm font-medium text-slate-900">{file.name}</div>
                      <div className="text-xs text-slate-500 mt-1">{humanFileSize(file.size)}</div>
                      <div className="text-xs text-slate-400 mt-1">{file.type || '—'}</div>

                  </div>
                )}

                {(status === 'uploading' || uploadProgress > 0) && (
                  <div className="mt-6">
                    <div className="text-xs text-slate-500 mb-2">Uploading</div>
                    <div className="w-full bg-slate-100 rounded-full h-12 overflow-hidden">

                    </div>
                    <div className="text-sm text-slate-600 mt-3 text-center font-semibold">{uploadProgress || 0}%</div>
                  </div>
                )}

                {status === 'waiting' && code && (
                  <div className="mt-4">
                    <div className="text-sm text-slate-600">Share this 4 digit code with the receiver</div>
                    <div className="mt-2 inline-flex items-center gap-3 px-3 py-2 bg-blue-50 text-blue-700 font-semibold rounded-lg border border-blue-100">

                </form>

                {isInWebView() && (
                  <div className="mt-4 p-3 bg-yellow-50 rounded-md border border-yellow-100 text-yellow-700 text-sm">

                {fileMeta && (

function Notifications({ currentUser, hideNotifications }) {
  const [notifications, setNotifications] = React.useState([]);
  const [error, setError] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const [deletingAll, setDeletingAll] = React.useState(false);
  const [deleteProgress, setDeleteProgress] = React.useState({ total: 0, done: 0, failed: 0 });

  const fetchIntervalRef = React.useRef(null);
  const notificationsRef = React.useRef([]);
  const interactingRef = React.useRef(false);
  const pendingRef = React.useRef(null);
  const cancelBulkRef = React.useRef(false);

  // Helper: mock avatar
  function mockAvatarUrl(username) {
    const name = username || 'User';
    return 'https://ui-avatars.com/api/?name=' + encodeURIComponent(name) + '&background=E6EEF8&color=1E3A8A&size=128&rounded=true';
  }

  // Merge server notifications (preserves object references)
  function mergeNotifications(serverList) {
    const local = notificationsRef.current.slice();
    const byId = new Map(local.map(n => [n.id, n]));

    // Add or update from server
    serverList.forEach(s => {
      if (byId.has(s.id)) {
        Object.assign(byId.get(s.id), s);
        if (!byId.get(s.id).avatar) byId.get(s.id).avatar = mockAvatarUrl(s.username);
      } else {
        const copy = { ...s, avatar: s.avatar || mockAvatarUrl(s.username) };
        local.unshift(copy); // newest at top
      }
    });

    // Remove items no longer on server
    const serverIds = new Set(serverList.map(x => x.id));
    const filtered = local.filter(x => serverIds.has(x.id));

    notificationsRef.current = filtered;
    setNotifications(filtered);
  }

  // Fetch notifications
  async function loadNotifications() {
    try {
      setLoading(true);
      const res = await fetch('/get-notifications?username=' + encodeURIComponent(currentUser));
      if (!res.ok) throw new Error('Failed to load notifications');
      const data = await res.json();

      // Attach avatars
      data.forEach(n => {
        if (!n.avatar) n.avatar = mockAvatarUrl(n.username);
      });

      // Sort: NEWEST FIRST (always)
      data.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      if (interactingRef.current) {
        pendingRef.current = data;
      } else {
        mergeNotifications(data);
        pendingRef.current = null;
      }
      setError(null);
    } catch (err) {
      setError(err.message || 'Unknown error');
    } finally {
      setLoading(false);
    }
  }

  React.useEffect(() => {
    loadNotifications();
    fetchIntervalRef.current = setInterval(loadNotifications, 30000);
    return () => {
      if (fetchIntervalRef.current) clearInterval(fetchIntervalRef.current);
    };
  }, [currentUser]);

  React.useEffect(() => {
    notificationsRef.current = notifications;
  }, [notifications]);

  function setInteracting(val) {
    interactingRef.current = val;
    if (!val && pendingRef.current) {
      mergeNotifications(pendingRef.current);
      pendingRef.current = null;
    }
  }

  // Mark single as read
  async function markAsRead(id) {
    try {
      await fetch('/mark-notification-read', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser, notificationId: id })
      });
      const list = notificationsRef.current;
      const n = list.find(x => x.id === id);
      if (n) n.read = true;
      setNotifications([...list]);
    } catch (err) {
      console.error('Mark read error:', err);
    }
  }

  // Mark all as read
  async function markAllRead() {
    try {
      setLoading(true);
      const unread = notificationsRef.current.filter(n => !n.read);
      for (const n of unread) {
        await fetch('/mark-notification-read', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: currentUser, notificationId: n.id })
        });
        n.read = true;
      }
      setNotifications([...notificationsRef.current]);
    } catch (err) {
      console.error('Mark all read error:', err);
    } finally {
      setLoading(false);
    }
  }

  // Immediate delete (no undo)
  async function deleteNotification(id) {
    try {
      await fetch('/delete-notification', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser, notificationId: id })
      });

      const updated = notificationsRef.current.filter(n => n.id !== id);
      notificationsRef.current = updated;
      setNotifications(updated);
    } catch (err) {
      console.error('Delete failed:', err);
    }
  }

  // Bulk delete all
  async function deleteAllSequential() {
    if (deletingAll || notifications.length === 0) return;
    cancelBulkRef.current = false;
    setDeletingAll(true);
    setInteracting(true);
    setDeleteProgress({ total: notifications.length, done: 0, failed: 0 });

    const list = [...notificationsRef.current];

    for (let i = 0; i < list.length; i++) {
      if (cancelBulkRef.current) break;
      const n = list[i];
      n._bulkStatus = 'deleting';
      setNotifications([...notificationsRef.current]);

      try {
        const res = await fetch('/delete-notification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: currentUser, notificationId: n.id })
        });
        if (!res.ok) throw new Error();
        n._bulkStatus = 'deleted';
        setDeleteProgress(p => ({ ...p, done: p.done + 1 }));
      } catch {
        n._bulkStatus = 'failed';
        setDeleteProgress(p => ({ ...p, failed: p.failed + 1 }));
      }
      setNotifications([...notificationsRef.current]);
      await new Promise(r => setTimeout(r, 100));
    }

    // Clean up deleted
    const cleaned = notificationsRef.current.filter(n => n._bulkStatus !== 'deleted');
    notificationsRef.current = cleaned;
    setNotifications(cleaned);
    setDeletingAll(false);
    setInteracting(false);
    setDeleteProgress({ total: 0, done: 0, failed: 0 });
  }

  function cancelDeleteAll() {
    cancelBulkRef.current = true;
  }

  // Dropdown Menu
  function DropdownMenu({ id, isRead, onOpenLink }) {
    const [open, setOpen] = React.useState(false);
    React.useEffect(() => setInteracting(open), [open]);

    return (
      <div className="relative">
        <button
          onClick={e => { e.stopPropagation(); setOpen(!open); }}
          className="p-2 rounded-full hover:bg-gray-100 transition"
        >
          <svg className="w-5 h-5 text-gray-600" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="5" cy="12" r="2" />
            <circle cx="12" cy="12" r="2" />
            <circle cx="19" cy="12" r="2" />
          </svg>
        </button>
        {open && (
          <div
            className="absolute right-0 mt-2 w-44 bg-white border rounded-lg shadow-lg z-40"
            onClick={e => e.stopPropagation()}
          >
            <button
              className="w-full text-left px-4 py-2 hover:bg-gray-50"
              onClick={() => { setOpen(false); onOpenLink?.(); }}
            >
              Open link
            </button>
            {!isRead && (
              <button
                className="w-full text-left px-4 py-2 hover:bg-gray-50"
                onClick={() => { setOpen(false); markAsRead(id); }}
              >
                Mark as read
              </button>
            )}
            <button
              className="w-full text-left px-4 py-2 text-red-600 hover:bg-red-50"
              onClick={() => { setOpen(false); deleteNotification(id); }}
            >
              Delete
            </button>
          </div>
        )}
      </div>
    );
  }

  // Notification Item
  function NotificationItem({ n }) {
    return (
      <li
        key={n.id}
        onClick={() => {
          if (!n.read) markAsRead(n.id);
          if (n.link) Lexum.navigate(n.link);
        }}
        className={`p-4 rounded-lg border flex gap-4 items-start cursor-pointer transition-shadow hover:shadow-md ${
          n.read ? 'bg-white border-gray-200' : 'bg-blue-50 border-blue-200'
        }`}
      >
        <img
          src={n.avatar}
          alt="avatar"
          className="w-12 h-12 rounded-full object-cover flex-shrink-0"
        />
        <div className="flex-1 min-w-0">
          <p className="text-sm text-gray-800 leading-snug break-words">
            <SafeHTML html={n.message} />
          </p>
          <p className="text-xs text-gray-500 mt-1">
            {timeAgo(n.timestamp)}
          </p>
          {n._bulkStatus && (
            <span
              className={`inline-block mt-2 text-xs px-3 py-1 rounded-full ${
                n._bulkStatus === 'deleting'
                  ? 'bg-yellow-100 text-yellow-700'
                  : n._bulkStatus === 'deleted'
                  ? 'bg-green-100 text-green-700'
                  : 'bg-red-100 text-red-700'
              }`}
            >
              {n._bulkStatus === 'deleting' ? 'Deleting...' : n._bulkStatus === 'deleted' ? 'Deleted' : 'Failed'}
            </span>
          )}
        </div>
        <DropdownMenu id={n.id} isRead={n.read} onOpenLink={() => n.link && Lexum.navigate(n.link)} />
      </li>
    );
  }

  return (
    <div className="h-screen max-w-[700px] mx-auto bg-gray-50 flex flex-col">
      {/* Header */}
      <div className="sticky top-0 bg-white border-b z-10">
        <div className="px-4 py-4">
          <div className="flex items-center justify-between mb-3">
            <div>
              <h3 className="font-bold text-xl text-gray-900">Notifications</h3>
              <p className="text-sm text-gray-500">Stay updated with activity</p>
            </div>
            <button
              onClick={hideNotifications}
              className="p-2 rounded-full hover:bg-gray-100 lg:hidden"
              aria-label="Close"
            >
              <svg className="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>

          {/* Action buttons - stacked on mobile, inline on desktop */}
          {deletingAll ? (
            <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:gap-4 py-2">
              <div className="text-sm text-gray-700">Deleting {deleteProgress.done}/{deleteProgress.total}</div>
              <div className="w-full sm:w-48 h-2 bg-gray-200 rounded-full overflow-hidden">
                <div
                  style={{ width: `${deleteProgress.total ? (deleteProgress.done / deleteProgress.total) * 100 : 0}%` }}
                  className="h-full bg-blue-600 transition-all"
                />
              </div>
              <button
                onClick={cancelDeleteAll}
                className="px-4 py-2 text-sm bg-gray-100 hover:bg-gray-200 rounded-lg"
              >
                Cancel
              </button>
            </div>
          ) : (
            <div className="flex flex-col gap-3 sm:flex-row sm:gap-4">
              <button
                onClick={markAllRead}
                disabled={loading}
                className="px-4 py-2 text-sm bg-gray-100 hover:bg-gray-200 rounded-lg disabled:opacity-50"
              >
                Mark all as read
              </button>
              <button
                onClick={deleteAllSequential}
                className="px-4 py-2 text-sm bg-red-50 hover:bg-red-100 text-red-600 rounded-lg"
              >
                Delete all
              </button>
              <button
                onClick={hideNotifications}
                className="hidden lg:block p-2 rounded-full hover:bg-gray-100"
                aria-label="Close"
              >
                <svg className="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
          )}
        </div>
      </div>

      {/* Content */}
      <div className="flex-1 overflow-y-auto">
        {error ? (
          <div className="p-8 text-center text-red-500">{error}</div>
        ) : loading && notifications.length === 0 ? (
          <div className="p-8 text-center text-gray-500">Loading notifications...</div>
        ) : notifications.length === 0 ? (
          <div className="p-8 text-center text-gray-500 text-lg">
            You're all caught up! 🎉
          </div>
        ) : (
          <ul className="p-4 space-y-3">
            {notifications.map(n => (
              <NotificationItem key={n.id} n={n} />
            ))}
          </ul>
        )}
      </div>
    </div>
  );
}

    friends: { data: [], loading: true, error: null },
    following: { data: [], loading: true, error: null },
    followers: { data: [], loading: true, error: null },
    suggestions: { data: [], loading: true, error: null },
  });

 React.useEffect(() => {
    fetch(`/profile/${encodeURIComponent(username)}`)
      .then(r => r.ok ? r.json() : Promise.reject(r.statusText))
      .then(data => {
        setProfile(data);
        Lexum.ready();
      })
      .catch(err => {
        console.error('Profile load error:', err);
        Lexum.ready();
      });
  }, [username]);

  const fetchList = (key, endpoint) => {
    setLists(prev => ({
      ...prev,
      [key]: { data: [], loading: true, error: null }
    }));
    fetch(`${endpoint}?username=${encodeURIComponent(username)}`)
      .then(r => {
        if (!r.ok) throw new Error(r.statusText);
        return r.json();
      })
      .then(data => {
        setLists(prev => ({
          ...prev,
          [key]: { data, loading: false, error: null }
        }));
      })
      .catch(err => {
        setLists(prev => ({
          ...prev,
          [key]: { data: [], loading: false, error: err.message }
        }));
      });
  };

 React.useEffect(() => {
    fetchList('friends', '/get-user-friends');
    fetchList('following', '/get-user-following');
    fetchList('followers', '/get-user-followers');
    fetchList('suggestions', '/get-suggestions-feed');

              }`}

              {tab.label}
