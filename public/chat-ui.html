  <script>
    (function () {
      function safeCallDarkReader(fn) {
        // If DarkReader exists call immediately; otherwise poll a few times.
        if (window.DarkReader) {
          try { fn(); } catch (e) { console.error("DarkReader error", e); }
          return;
        }
        // Poll up to 30 times (3s) for library to become available
        let tries = 0;
        const t = setInterval(() => {
          tries += 1;
          if (window.DarkReader) {
            clearInterval(t);
            try { fn(); } catch (e) { console.error("DarkReader error", e); }
          } else if (tries > 30) {
            clearInterval(t);
            console.warn("DarkReader not found after waiting — preferences requiring DarkReader will be skipped.");
          }
        }, 5000);
      }
    
      function applyDarkMode(mode) {
        // mode: 'system' | 'dark' | 'light' | 'custom'
        if (mode === "light") {
          // ensure DarkReader is disabled
          if (window.DarkReader) {
            try { window.DarkReader.disable(); } catch (e) { console.error(e); }
          }
          return;
        }
    
        // For the rest we need DarkReader
        safeCallDarkReader(() => {
          try {
            // give DarkReader access to fetch if available
            if (window.DarkReader && typeof window.DarkReader.setFetchMethod === "function") {
              window.DarkReader.setFetchMethod(window.fetch);
            }
          } catch (e) { /* ignore */ }
    
          if (mode === "dark") {
            window.DarkReader.enable({ brightness: 100, contrast: 100, sepia: 0 });
          } else if (mode === "custom") {
            window.DarkReader.enable({ brightness: 110, contrast: 90, sepia: 8 });
          } else {
            // system
            if (typeof window.DarkReader.auto === "function") {
              window.DarkReader.auto({ brightness: 100, contrast: 100, sepia: 0 });
            } else {
              // fallback: simple enable/disable based on system
              const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
              prefersDark ? window.DarkReader.enable() : window.DarkReader.disable();
            }
          }
        });
      }
    
      // bootstrap from localStorage (defaults)
      const savedMode = localStorage.getItem("darkMode") || "system";
      const savedTheme = localStorage.getItem("theme") || "blue";
    
      applyDarkMode(savedMode);
    
      // Listen to custom events from Preferences UI
      window.addEventListener("app:preferences:update", (e) => {
        try {
          const detail = e.detail || {};
          if (typeof detail.darkMode === "string") {
            localStorage.setItem("darkMode", detail.darkMode);
            applyDarkMode(detail.darkMode);
          }
        } catch (err) {
          console.error("app:preferences:update handler error", err);
        }
      });
    
      // Listen to storage events for cross-tab sync
      window.addEventListener("storage", (e) => {
        if (e.key === "darkMode" && e.newValue) {
          applyDarkMode(e.newValue);
        }
      });
    
      // react to OS theme changes when in 'system' mode
      if (window.matchMedia) {
        const mq = window.matchMedia("(prefers-color-scheme: dark)");
        // use addEventListener if available
        if (mq.addEventListener) {
          mq.addEventListener("change", () => {
            const current = localStorage.getItem("darkMode") || "system";
            if (current === "system") applyDarkMode("system");
          });
        } else if (mq.addListener) {
          mq.addListener(() => {
            const current = localStorage.getItem("darkMode") || "system";
            if (current === "system") applyDarkMode("system");
          });
        }
      }
    })();
    </script>

                        const id = entry.target.dataset.msgId;
                        setMessages((prev) =>

                        socketRef.current.emit('message-read', { messageId: id });

            peerRef.current = createPeer(incomingCaller);
            await peerRef.current.setRemoteDescription(new RTCSessionDescription(incomingOffer));
            const answer = await peerRef.current.createAnswer();
            await peerRef.current.setLocalDescription(answer);
            socketRef.current.emit('answer-call', { to: incomingCaller, answer });
        } catch (err) {
            console.error('Accept call error:', err);
            endCallCleanup('error');
        }
    };

        if (outgoingToneRef.current) outgoingToneRef.current.pause();
        if (incomingToneRef.current) incomingToneRef.current.pause();
        clearInterval(timerRef.current);
        const start = callStartRef.current,
            end = Date.now();
        const duration = reason === 'ended' && acceptedCall ? Math.floor((end - start) / 1000) : 0;
        const rec = {
            id: `${start}`,
            type: reason === 'rejected' ? 'rejected' : 'call',
            direction: incomingOffer ? 'incoming' : 'outgoing',
            timestamp: new Date(start || end).toISOString(),
            duration,
        };
        const key = `callHistory_${CURRENT_USER}_${selected?.username || incomingCaller}`;
        const arr = JSON.parse(localStorage.getItem(key)) || [];
        arr.push(rec);
        localStorage.setItem(key, JSON.stringify(arr));
        setCallHistory(arr);
        setShowCallModal(false);
        setInCall(false);
        setAcceptedCall(false);
        setIncomingOffer(null);
        setIncomingCaller(null);
        if (localStreamRef.current) {
            localStreamRef.current.getTracks().forEach((t) => t.stop());

        if (peerRef.current) peerRef.current.close();
        peerRef.current = null;
        localStreamRef.current = null;

            2.72 8.986 8.986 0 0 0 3.74.477m.94-3.197a5.971

      ),
    },
  ];

  // Swipe handling
  const touchStartX = React.useRef(null);

  const handleTouchStart = (e) => {
    touchStartX.current = e.touches[0].clientX;
  };

  const handleTouchEnd = (e) => {
    if (touchStartX.current === null) return;
    const diff = e.changedTouches[0].clientX - touchStartX.current;
    if (Math.abs(diff) > 50) {
      // swipe right
      if (diff > 0 && tab === TABS.GROUPS) {
        setTab(TABS.CHATS);
      }
      // swipe left
      if (diff < 0 && tab === TABS.CHATS) {
        setTab(TABS.GROUPS);
      }
    }
    touchStartX.current = null;
  };

  return (
    <div className="flex flex-col h-screen bg-gray-100 dark:bg-gray-900">
      <div
        className="flex-1 overflow-hidden"
        role="tabpanel"
        id={`panel-${tab}`}
        onTouchStart={handleTouchStart}
        onTouchEnd={handleTouchEnd}
      >
          <ChatApp
            contactsCache={contactsCache}
            setContactsCache={setContactsCache}
            contactsMetaCache={contactsMetaCache}
            setContactsMetaCache={setContactsMetaCache}
          />
      </div>
    </div>
  );
}


    ReactDOM.render(<MainApp />, document.getElementById('root'));
