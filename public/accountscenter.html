<script>
  (function () {
    function safeCallDarkReader(fn) {
      // If DarkReader exists call immediately; otherwise poll a few times.
      if (window.DarkReader) {
        try { fn(); } catch (e) { console.error("DarkReader error", e); }
        return;
      }
      // Poll up to 30 times (3s) for library to become available
      let tries = 0;
      const t = setInterval(() => {
        tries += 1;
        if (window.DarkReader) {
          clearInterval(t);
          try { fn(); } catch (e) { console.error("DarkReader error", e); }
        } else if (tries > 30) {
          clearInterval(t);
          console.warn("DarkReader not found after waiting — preferences requiring DarkReader will be skipped.");
        }
      }, 100);
    }
  
    function applyDarkMode(mode) {
      // mode: 'system' | 'dark' | 'light' | 'custom'
      if (mode === "light") {
        // ensure DarkReader is disabled
        if (window.DarkReader) {
          try { window.DarkReader.disable(); } catch (e) { console.error(e); }
        }
        return;
      }
  
      // For the rest we need DarkReader
      safeCallDarkReader(() => {
        try {
          // give DarkReader access to fetch if available
          if (window.DarkReader && typeof window.DarkReader.setFetchMethod === "function") {
            window.DarkReader.setFetchMethod(window.fetch);
          }
        } catch (e) { /* ignore */ }
  
        if (mode === "dark") {
          window.DarkReader.enable({ brightness: 100, contrast: 100, sepia: 0 });
        } else if (mode === "custom") {
          window.DarkReader.enable({ brightness: 110, contrast: 90, sepia: 8 });
        } else {
          // system
          if (typeof window.DarkReader.auto === "function") {
            window.DarkReader.auto({ brightness: 100, contrast: 100, sepia: 0 });
          } else {
            // fallback: simple enable/disable based on system
            const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            prefersDark ? window.DarkReader.enable() : window.DarkReader.disable();
          }
        }
      });
    }
  
    // bootstrap from localStorage (defaults)
    const savedMode = localStorage.getItem("darkMode") || "system";
    const savedTheme = localStorage.getItem("theme") || "blue";
  
    applyDarkMode(savedMode);
  
    // Listen to custom events from Preferences UI
    window.addEventListener("app:preferences:update", (e) => {
      try {
        const detail = e.detail || {};
        if (typeof detail.darkMode === "string") {
          localStorage.setItem("darkMode", detail.darkMode);
          applyDarkMode(detail.darkMode);
        }
      } catch (err) {
        console.error("app:preferences:update handler error", err);
      }
    });
  
    // Listen to storage events for cross-tab sync
    window.addEventListener("storage", (e) => {
      if (e.key === "darkMode" && e.newValue) {
        applyDarkMode(e.newValue);
      }
    });
  
    // react to OS theme changes when in 'system' mode
    if (window.matchMedia) {
      const mq = window.matchMedia("(prefers-color-scheme: dark)");
      // use addEventListener if available
      if (mq.addEventListener) {
        mq.addEventListener("change", () => {
          const current = localStorage.getItem("darkMode") || "system";
          if (current === "system") applyDarkMode("system");
        });
      } else if (mq.addListener) {
        mq.addListener(() => {
          const current = localStorage.getItem("darkMode") || "system";
          if (current === "system") applyDarkMode("system");
        });
      }
    }
  })();
  </script>

async function fetchHistoricalData(username) {
  try {
    // Fetch user's posts
    var postsRes = await fetch('/get-user-posts?username=' + encodeURIComponent(username));
    var posts = await postsRes.json();
    if (!postsRes.ok) throw new Error(posts.error || 'Failed to load posts');

    // Determine periods:
    var now = new Date();
    var MS_DAY = 24 * 60 * 60 * 1000;
    var currentPeriodStart = new Date(now.getTime() - (30 * MS_DAY)); // last 30 days
    var prevPeriodStart = new Date(now.getTime() - (60 * MS_DAY));    // 30-60 days ago
    var prevPeriodEnd = new Date(now.getTime() - (30 * MS_DAY));

    // Posts for previous period (used by OrganisationInsights as historicalData.posts)
    var prevPosts = posts.filter(function(post) {
      var d = new Date(post.created_at);
      return d >= prevPeriodStart && d < prevPeriodEnd;
    });

    // Helper to sum interactions in an array of posts
    function sumInteractions(postArray) {
      return postArray.reduce(function(sum, p) {
        var likes = (p.likes && p.likes.length) ? p.likes.length : 0;
        var comments = (p.comments && p.comments.length) ? p.comments.length : 0;
        var pollVotes = 0;
        if (p.options && p.options.length) {
          pollVotes = p.options.reduce(function(s, o) {
            return s + ((o.votes && o.votes.length) ? o.votes.length : 0);
          }, 0);
        }
        return sum + likes + comments + pollVotes;
      }, 0);
    }

    var prevInteractions = sumInteractions(prevPosts);

    // Try to get follower count:
    // - If you have a global fetchProfile helper, use it; otherwise fall back to looking at profile-like fields in posts or default to 1.
    var followersCount = 1;
    try {
      if (typeof fetchProfile === 'function') {
        var prof = await fetchProfile(username);
        if (prof && prof.followers && prof.followers.length) {
          followersCount = prof.followers.length;
        } else if (prof && typeof prof.followers_count === 'number') {
          followersCount = prof.followers_count || 1;
        }
      } else {
        // try an endpoint fallback
        var profRes = await fetch('/get-user-profile?username=' + encodeURIComponent(username));
        if (profRes && profRes.ok) {
          var profData = await profRes.json();
          if (profData && profData.followers && profData.followers.length) {
            followersCount = profData.followers.length;
          } else if (profData && typeof profData.followers_count === 'number') {
            followersCount = profData.followers_count || 1;
          }
        }
      }
    } catch (e) {
      // keep followersCount = 1 as fallback
      console.warn('Could not fetch profile for followers count', e);
    }

    // Also build a monthly breakdown array (sorted oldest->newest)
    var byMonth = {};
    posts.forEach(function(post) {
      var date = new Date(post.created_at);
      var key = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
      if (!byMonth[key]) byMonth[key] = { count: 0, mediaCount: 0, pollCount: 0 };
      byMonth[key].count++;
      if (post.media && post.media.length > 0) byMonth[key].mediaCount++;
      if (post.poll_options && post.poll_options.length > 0) byMonth[key].pollCount++;
    });
    var breakdownArray = Object.keys(byMonth).sort().map(function(k) {
      return { month: k, count: byMonth[k].count, mediaCount: byMonth[k].mediaCount, pollCount: byMonth[k].pollCount };
    });

    return {
      // Fields OrganisationInsights expects:
      posts: prevPosts,                     // array (previous period)
      interactions: prevInteractions,       // number
      followers: followersCount,            // number

      // Extra fields (useful elsewhere)
      totalPosts: posts.length,
      totalMediaPosts: posts.filter(function(p){ return p.media && p.media.length > 0; }).length,
      totalPolls: posts.filter(function(p){ return p.poll_options && p.poll_options.length > 0; }).length,
      monthlyBreakdown: breakdownArray
    };
  } catch (err) {
    console.error('Error building historical data:', err);
    return { posts: [], interactions: 0, followers: 1, monthlyBreakdown: [], totalPosts: 0, totalMediaPosts: 0, totalPolls: 0 };
  }
}

    function SafeHTML({ html }) {
      const [processedHTML, setProcessedHTML] = useState('');
      useEffect(() => {
        async function parseAndValidate(html) {
          const mentionRegex = /@([\w\s]+)/g;
          const mentions = [...html.matchAll(mentionRegex)].map((m) => m[1].trim());
          const validMentions = new Set();
          await Promise.all(
            mentions.map(async (username) => {
              try {
                const res = await fetch(`/profile/${encodeURIComponent(username)}`);
                const data = await res.json();
                if (!data.error) {
                  validMentions.add(username);
                }
              } catch (_) {}
            })
          );
          let parsed = html.replace(
            /@([\w\s]+)/g,
            (match, username) => {
              username = username.trim();
              if (validMentions.has(username)) {
                return `<a data-lexum href="/@${encodeURIComponent(username)}" class="text-blue-500 hover:underline">@${username}</a>`;
              }
              return match;
            }
          );
          parsed = parsed.replace(
            /(https?:\/\/[^\s]+)/g,
            (url) =>
              `<a href="/link?url=${url}" class="text-blue-500 underline" target="_blank" rel="noopener noreferrer">${url}</a>`
          );
          setProcessedHTML(DOMPurify.sanitize(parsed));
        }
        parseAndValidate(html);
      }, [html]);
      return (
        <div
          className="prose max-w-none"
          dangerouslySetInnerHTML={{ __html: processedHTML }}
        />
      );
    }

    function VideoPlayer({ src, poster }) {
      const videoRef = useRef();

      const [playing, setPlaying] = useState(false);
      const [muted, setMuted] = useState(false);
      const [vol, setVol] = useState(1);
      const [time, setTime] = useState({ cur: 0, total: 0 });
      const [fs, setFs] = useState(false);

      const togglePlay = () => {
        const v = videoRef.current;
        v.paused ? v.play() : v.pause();
        const btn = containerRef.current.querySelector('.big-play');
        btn.classList.add('pulse');
        setTimeout(() => btn.classList.remove('pulse'), 400);
      };

      const toggleMute = e => {
        e.stopPropagation();
        const v = videoRef.current;
        v.muted = !v.muted;
        setMuted(v.muted);
      };

      const onVol = e => {
        e.stopPropagation();
        const v = videoRef.current;
        const val = parseFloat(e.target.value);
        v.volume = val;
        setVol(val);
        setMuted(val === 0);
      };

      const toggleFs = e => {
        e.stopPropagation();
        const el = containerRef.current;
        !document.fullscreenElement ? el.requestFullscreen() : document.exitFullscreen();
      };

      useEffect(() => {
        const v = videoRef.current;
        const update = () => setTime({ cur: v.currentTime, total: v.duration });
        const onPlay = () => setPlaying(true);
        const onPause = () => setPlaying(false);
        const onFsChange = () => setFs(!!document.fullscreenElement);
        v.addEventListener('timeupdate', update);
        v.addEventListener('loadedmetadata', update);
        v.addEventListener('play', onPlay);
        v.addEventListener('pause', onPause);
        document.addEventListener('fullscreenchange', onFsChange);
        return () => {
          v.removeEventListener('timeupdate', update);
          v.removeEventListener('loadedmetadata', update);
          v.removeEventListener('play', onPlay);
          v.removeEventListener('pause', onPause);
          document.removeEventListener('fullscreenchange', onFsChange);
        };
      }, []);

      const fmt = s => {
        const m = Math.floor(s / 60).toString().padStart(2, '0');
        const sec = Math.floor(s % 60).toString().padStart(2, '0');
        return `${m}:${sec}`;
      };

      const Icon = ({ children }) => (
        <svg viewBox="0 0 64 64" className="w-6 h-6 text-white">
          {children}
        </svg>
      );

      const PlaySVG = (
        <Icon>
          <polygon points="16,8 56,32 16,56" fill="currentColor" />
        </Icon>
      );

      const PauseSVG = (
        <Icon>
          <rect x="16" y="8" width="12" height="48" fill="currentColor" />
          <rect x="36" y="8" width="12" height="48" fill="currentColor" />
        </Icon>
      );

      const VolSVG = muted || vol === 0 ? (
        <Icon>
          <polygon points="16,24 28,24 44,8 44,56 28,40 16,40" fill="currentColor" />
          <line x1="48" y1="16" x2="56" y2="24" stroke="currentColor" strokeWidth="4" />
          <line x1="48" y1="48" x2="56" y2="40" stroke="currentColor" strokeWidth="4" />
        </Icon>
      ) : (
        <Icon>
          <polygon points="16,24 28,24 44,8 44,56 28,40 16,40" fill="currentColor" />
          <path d="M48,16 C54,24 54,40 48,48" fill="none" stroke="currentColor" strokeWidth="4" />
        </Icon>
      );

      const FsSVG = fs ? (
        <Icon>
          <path d="M16 32 H8 V8 H32 V16 H16 Z M48 32 H56 V56 H32 V48 H48 Z" fill="currentColor" />
        </Icon>
      ) : (
        <Icon>
          <path d="M16 16 H32 V8 H8 V32 H16 Z M48 48 H32 V56 H56 V32 H48 Z" fill="currentColor" />
        </Icon>
      );

      return (
        <div
          ref={containerRef}
          className={`relative group h-[65vh] max-h-screen bg-black overflow-hidden cursor-pointer ${
            playing ? '' : 'filter brightness-75'
          }`}
          onClick={togglePlay}
          onContextMenu={e => e.preventDefault()}
          style={{ borderRadius: '20px' }}
        >
          <video ref={videoRef} src={src} poster={poster} className="w-full h-full object-cover" />
          <div
            className={`big-play absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-white transition-opacity transition-transform ${
              playing ? 'opacity-0 scale-0' : 'opacity-80 scale-125'
            } group-hover:opacity-100 group-hover:scale-150 pulse-target`}
          >
            {playing ? PauseSVG : PlaySVG}
          </div>
          <div
            onClick={e => e.stopPropagation()}
            className="absolute bottom-4 left-4 right-4 bg-black bg-opacity-50 backdrop-blur-sm rounded-lg flex items-center space-x-3 px-4 py-2 opacity-0 group-hover:opacity-100 transition-opacity duration-200"
          >
            <button onClick={togglePlay} className="p-1 hover:bg-black hover:bg-opacity-75 rounded-full">
              {playing ? PauseSVG : PlaySVG}
            </button>
            <input
              type="range"
              min="0"
              max={time.total || 0}
              step="0.1"
              value={time.cur}
              onChange={e => {
                const t = parseFloat(e.target.value);
                videoRef.current.currentTime = t;
                setTime(st => ({ ...st, cur: t }));
              }}
              className="flex-1 h-1 rounded-lg bg-white/30 appearance-none cursor-pointer"
            />
            <div className="text-white text-xs whitespace-nowrap">{fmt(time.cur)} / {fmt(time.total)}</div>
            <button onClick={toggleMute} className="p-1 hover:bg-black hover:bg-opacity-75 rounded-full">
              {VolSVG}
            </button>
            <input
              type="range"
              min="0"
              max="1"
              step="0.01"
              value={muted ? 0 : vol}
              onChange={onVol}
              className="w-24 h-1 rounded-lg bg-white/30 appearance-none cursor-pointer"
            />
            <button onClick={toggleFs} className="p-1 hover:bg-black hover:bg-opacity-75 rounded-full">
              {FsSVG}
            </button>
          </div>
        </div>
      );
    }

 const ManagePostsSection = memo(function ManagePostsSection({ posts, setPosts, profile, onPostCreated }) {

function OrganisationInsights({ profile, posts, historicalData }) {
  var likesCommentsRef = React.useRef(null);
  var engagementRef = React.useRef(null);
  var trendRef = React.useRef(null);
  var monthlyRef = React.useRef(null);

  // Small helper to destroy charts safely
  function safeDestroyChart(ref) {
    if (!ref || !ref.current) return;
    try {
      if (ref.current._chart) {
        ref.current._chart.destroy();
        ref.current._chart = null;
      }
    } catch (e) {
      console.warn('Could not destroy chart', e);
    }
  }

  React.useEffect(function () {
    // Basic totals from current posts
    var totalPosts = (posts && posts.length) ? posts.length : 0;
    var totalLikes = posts.reduce(function (sum, p) { return sum + ((p.likes && p.likes.length) ? p.likes.length : 0); }, 0);
    var totalComments = posts.reduce(function (sum, p) { return sum + ((p.comments && p.comments.length) ? p.comments.length : 0); }, 0);
    var totalPollVotes = posts.reduce(function (sum, p) {
      if (!p.options || !p.options.length) return sum;
      return sum + p.options.reduce(function (s, o) { return s + ((o.votes && o.votes.length) ? o.votes.length : 0); }, 0);
    }, 0);
    var totalInteractions = totalLikes + totalComments + totalPollVotes;
    var followersCount = 1;
    if (profile && profile.followers && profile.followers.length) {
      followersCount = profile.followers.length;
    } else if (profile && typeof profile.followers_count === 'number') {
      followersCount = profile.followers_count || 1;
    }

    // Historical values
    var histPosts = (historicalData && historicalData.posts) ? historicalData.posts : [];
    var histInteractions = (historicalData && typeof historicalData.interactions === 'number') ? historicalData.interactions : 0;
    var histFollowers = (historicalData && typeof historicalData.followers === 'number') ? historicalData.followers : followersCount || 1;

    // Engagement rates
    var engagementRate = Number(((totalInteractions / (followersCount || 1)) * 100).toFixed(1));
    var historicalEngagementRate = Number(((histInteractions / (histFollowers || 1)) * 100).toFixed(1));
    var improvementRate = 0;
    if (historicalEngagementRate && historicalEngagementRate !== 0) {
      improvementRate = Number((((engagementRate - historicalEngagementRate) / historicalEngagementRate) * 100).toFixed(1));
    }

    // Weekly data
    var MS_DAY = 24 * 60 * 60 * 1000;
    var nowTs = (new Date()).getTime();
    var weeklyData = [];
    for (var i = 3; i >= 0; i--) {
      var weekStartTs = nowTs - ((i + 1) * 7 * MS_DAY);
      var weekEndTs = nowTs - (i * 7 * MS_DAY);
      var weekPosts = posts.filter(function (p) {
        var d = new Date(p.created_at).getTime();
        return d >= weekStartTs && d < weekEndTs;
      });
      var weekInteractions = weekPosts.reduce(function (sum, p) {
        var likes = (p.likes && p.likes.length) ? p.likes.length : 0;
        var comments = (p.comments && p.comments.length) ? p.comments.length : 0;
        var pollVotes = 0;
        if (p.options && p.options.length) {
          pollVotes = p.options.reduce(function (s, o) { return s + ((o.votes && o.votes.length) ? o.votes.length : 0); }, 0);
        }
        return sum + likes + comments + pollVotes;
      }, 0);
      weeklyData.push(Number(((weekInteractions / (followersCount || 1)) * 100).toFixed(1)));
    }

    var monthlyBreakdown = (historicalData && historicalData.monthlyBreakdown && historicalData.monthlyBreakdown.length)
      ? historicalData.monthlyBreakdown
      : [];

    // Create/destroy charts safely
    safeDestroyChart(likesCommentsRef);
    safeDestroyChart(engagementRef);
    safeDestroyChart(trendRef);
    safeDestroyChart(monthlyRef);

    if (likesCommentsRef.current) {
      likesCommentsRef.current._chart = new Chart(likesCommentsRef.current, {
        type: 'bar',
        data: {
          labels: ["Likes", "Comments", "Poll Votes"],
          datasets: [{
            label: "Total Interactions",
            data: [totalLikes, totalComments, totalPollVotes].map(Number),
            backgroundColor: ["#4CAF50", "#2196F3", "#FFC107"]
          }]
        },
        options: {
          scales: { y: { beginAtZero: true } },
          plugins: { tooltip: { callbacks: { label: function(ctx) { return ctx.label + ': ' + ctx.raw + ' interactions'; } } } }
        }
      });
    }

    if (engagementRef.current) {
      var inactive = 100 - (isNaN(engagementRate) ? 0 : engagementRate);
      engagementRef.current._chart = new Chart(engagementRef.current, {
        type: 'doughnut',
        data: {
          labels: ["Engagement %", "Inactive %"],
          datasets: [{ data: [Number(engagementRate) || 0, Number(inactive) || 0] }]
        },
        options: {
          plugins: { tooltip: { callbacks: { label: function(ctx) { return ctx.label + ': ' + ctx.raw + '%'; } } } }
        }
      });
    }

    if (trendRef.current) {
      trendRef.current._chart = new Chart(trendRef.current, {
        type: 'line',
        data: {
          labels: ["4 Weeks Ago", "3 Weeks Ago", "2 Weeks Ago", "Last Week"],
          datasets: [{
            label: "Engagement Rate (%)",
            data: weeklyData.map(Number),
            borderColor: "#2196F3",
            tension: 0.4,
            fill: false
          }]
        },
        options: {
          scales: { y: { beginAtZero: true } },
          plugins: { tooltip: { callbacks: { label: function(ctx) { return 'Week ' + (4 - ctx.dataIndex) + ': ' + Number(ctx.raw).toFixed(1) + '% engagement'; } } } }
        }
      });
    }

    if (monthlyRef.current) {
      var labels = monthlyBreakdown.map(function (m) { return m.month; });
      var counts = monthlyBreakdown.map(function (m) { return Number(m.count || 0); });
      monthlyRef.current._chart = new Chart(monthlyRef.current, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{ label: 'Posts per Month', data: counts }]
        },
        options: { scales: { y: { beginAtZero: true } } }
      });
    }

    return function cleanup() {
      safeDestroyChart(likesCommentsRef);
      safeDestroyChart(engagementRef);
      safeDestroyChart(trendRef);
      safeDestroyChart(monthlyRef);
    };
  }, [profile, posts, historicalData]);

  // Recompute summary numbers for render
  var totalPosts = (posts && posts.length) ? posts.length : 0;
  var totalLikes = posts.reduce(function (sum, p) { return sum + ((p.likes && p.likes.length) ? p.likes.length : 0); }, 0);
  var totalComments = posts.reduce(function (sum, p) { return sum + ((p.comments && p.comments.length) ? p.comments.length : 0); }, 0);
  var totalPollVotes = posts.reduce(function (sum, p) {
    if (!p.options || !p.options.length) return sum;
    return sum + p.options.reduce(function (s, o) { return s + ((o.votes && o.votes.length) ? o.votes.length : 0); }, 0);
  }, 0);
  var totalInteractions = totalLikes + totalComments + totalPollVotes;
  var followersCount = 1;
  if (profile && profile.followers && profile.followers.length) followersCount = profile.followers.length;
  else if (profile && typeof profile.followers_count === 'number') followersCount = profile.followers_count || 1;

  var engagementRate = Number(((totalInteractions / (followersCount || 1)) * 100).toFixed(1));
  var histInteractions = (historicalData && typeof historicalData.interactions === 'number') ? historicalData.interactions : 0;
  var histFollowers = (historicalData && typeof historicalData.followers === 'number') ? historicalData.followers : followersCount || 1;
  var historicalEngagementRate = Number(((histInteractions / (histFollowers || 1)) * 100).toFixed(1));
  var improvementRate = 0;
  if (historicalEngagementRate && historicalEngagementRate !== 0) {
    improvementRate = Number((((engagementRate - historicalEngagementRate) / historicalEngagementRate) * 100).toFixed(1));
  }

  return (
    <div className="max-w-4xl mx-auto animate-fade-in p-0 md:p-4">
      {/* Heading sits on the same continuous sheet on mobile */}
      <div className="bg-white p-1 md:p-6 md:rounded md:shadow">
        <h2 className="text-2xl font-bold mb-4 md:mb-6">Your Creator Dashboard</h2>

        {/* Top totals: continuous on mobile (gap-0) and card grid on desktop */}
        <div className="grid grid-cols-1 md:grid-cols-3 gap-0 md:gap-4">
          <div className="bg-white p-0 md:p-4 md:rounded md:shadow">
            <div className="text-sm text-gray-500">Total posts</div>
            <div className="text-xl font-semibold">{totalPosts}</div>
            <div className="text-xs text-gray-400 mt-2">Prev period posts: {(historicalData && typeof historicalData.totalPosts === 'number') ? historicalData.totalPosts : '—'}</div>
          </div>

          <div className="bg-white p-0 md:p-4 md:rounded md:shadow">
            <div className="text-sm text-gray-500">Media posts</div>
            <div className="text-xl font-semibold">{(historicalData && typeof historicalData.totalMediaPosts === 'number') ? historicalData.totalMediaPosts : '—'}</div>
            <div className="text-xs text-gray-400 mt-2">Media now: {posts.filter(function(p){ return p.media && p.media.length; }).length}</div>
          </div>

          <div className="bg-white p-0 md:p-4 md:rounded md:shadow">
            <div className="text-sm text-gray-500">Followers</div>
            <div className="text-xl font-semibold">{followersCount}</div>
            <div className="text-xs text-gray-400 mt-2">Prev interactions: {(historicalData && typeof historicalData.interactions === 'number') ? historicalData.interactions : 0}</div>
          </div>
        </div>

        {/* Two-column section: continuous on mobile */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-0 md:gap-6 mt-0 md:mt-6">
          <div className="bg-white p-0 md:p-6 md:rounded-lg md:shadow-md">
            <h3 className="text-lg font-semibold mb-4">Your Total Engagement</h3>
            <canvas ref={likesCommentsRef}></canvas>
            <ul className="mt-4 space-y-2 text-sm text-gray-700">
              <li>Total Likes: <span className="font-semibold">{totalLikes}</span></li>
              <li>Total Comments: <span className="font-semibold">{totalComments}</span></li>
              <li>Total Poll Votes: <span className="font-semibold">{totalPollVotes}</span></li>
            </ul>
          </div>

          <div className="bg-white p-0 md:p-6 md:rounded-lg md:shadow-md">
            <h3 className="text-lg font-semibold mb-4">Engagement Rate</h3>
            <div className="w-64 mx-auto">
              <canvas ref={engagementRef}></canvas>
            </div>
            <p className="mt-4 text-sm">
              Your posts are getting <span className="font-semibold">{engagementRate}%</span> engagement.
              {improvementRate > 0 ? (
                <span className="text-green-600"> That's {improvementRate}% better than the comparison period! 🎉</span>
              ) : improvementRate < 0 ? (
                <span className="text-red-600"> That's {Math.abs(improvementRate)}% lower than the comparison period.</span>
              ) : (
                <span className="text-gray-600"> No change from the comparison period.</span>
              )}
            </p>
          </div>
        </div>

        <div className="bg-white p-0 md:p-6 md:rounded-lg md:shadow-md mt-0 md:mt-6">
          <h3 className="text-lg font-semibold mb-4">Engagement Trend (last 4 weeks)</h3>
          <canvas ref={trendRef}></canvas>
        </div>

        <div className="bg-white p-0 md:p-6 md:rounded-lg md:shadow-md mt-0 md:mt-6">
          <h3 className="text-lg font-semibold mb-4">Monthly Breakdown</h3>
          <canvas ref={monthlyRef}></canvas>
        </div>

        <div className="bg-white p-0 md:p-6 md:rounded-lg md:shadow-md mt-0 md:mt-6">
          <h3 className="text-lg font-semibold mb-4">Tips to Boost Your Engagement</h3>
          <ul className="list-disc list-inside text-sm text-gray-600 space-y-2">
            <li>Post regularly to keep your audience interested!</li>
            <li>Add images or videos to make your posts more exciting.</li>
            <li>Try polls to get your followers to interact with you.</li>
            <li>Use the AI writer in the Composer above to create engaging posts!</li>
          </ul>
        </div>
      </div>
    </div>
  );
}

  );

  // When user changes darkMode, persist + broadcast
  React.useEffect(() => {
    localStorage.setItem("darkMode", darkMode);
    window.dispatchEvent(
      new CustomEvent("app:preferences:update", { detail: { darkMode } })
    );
  }, [darkMode]);

  function handleReset() {
    const defaults = { darkMode: "system" };
    setDarkMode(defaults.darkMode);
    // localStorage and event will be handled by effects
  }

  return (
    <div style={{ maxWidth: 760, margin: "0 auto", padding: 18 }}>
      <h3 style={{ margin: "0 0 12px 0" }}>Preferences</h3>

      <section style={{ marginBottom: 18 }}>
        <label htmlFor="mode-select" style={{ display: "block", marginBottom: 8 }}>
          Theme mode
        </label>
        <select
          id="mode-select"
          value={darkMode}
          onChange={(e) => setDarkMode(e.target.value)}
          style={{ padding: "8px 10px", borderRadius: 6 }}
        >
          <option value="system">Follow system</option>
          <option value="light">Light only</option>
          <option value="dark">Dark only</option>
          <option value="custom">Custom (softer dark)</option>
        </select>
        <p style={{ marginTop: 8, color: "#6b7280" }}>
          Choose whether the app follows your device theme, or force light/dark.
        </p>
      </section>
    </div>
  );
}

      }

      return (
        <div className="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-8 space-y-6 animate-fade-in">
          <h3 className="text-2xl font-semibold">Activity Logs</h3>
          {logs.length === 0 ? (
            <p className="text-gray-600">No recent activity.</p>
          ) : (
            <ul className="space-y-4">
              {logs.map((log, i) => (
                <li key={i} className="text-sm text-gray-600">
                  {log.action} at {new Date(log.timestamp).toLocaleString()}
                </li>
              ))}
            </ul>
          )}
        </div>
      );
    }

    function AccountDeactivationSection() {
      const handleDeactivate = async () => {
        if (!confirm('Are you sure you want to deactivate your account? This action cannot be undone.')) return;
        try {
          const res = await fetch('/deactivate-account', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: localStorage.currentUser })
          });
          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error || 'Deactivation failed');
          }
          localStorage.removeItem('currentUser');
          window.location.href = '/auth';
        } catch (e) {
          alert(e.message);
        }
      };

      return (
        <div className="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-8 space-y-6 animate-fade-in">
          <h3 className="text-2xl font-semibold text-red-600">Deactivate Account</h3>
          <p className="text-gray-600">Deactivating your account will permanently delete your profile, posts, and all associated data.</p>
          <button
            onClick={handleDeactivate}
            className="w-full px-6 py-3 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700 transition duration-200"
          >
            Deactivate Account
          </button>
        </div>
      );
    }

    ReactDOM.render(<AccountsCenter />, document.getElementById('root'));
  </script>
</body>
</html>
